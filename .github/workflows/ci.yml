name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_PYTHON: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
