# Every v* tag: run the tests, build the station on Linux and Windows,
# smoke-test each build, and publish four files on the release for the tag:
#
#   EstacionCICG-<version>-Windows-Instalador.exe   (packaging/cicg-estacion.iss)
#   EstacionCICG-<version>-Windows-Portable.exe
#   EstacionCICG-<version>-Linux-Instalador.tar.gz  (binary + instalar.sh)
#   EstacionCICG-<version>-Linux-Portable
#
# The station's update notice (adapters/updates.py) looks for exactly these
# names. The release text comes from CHANGELOG.md (packaging/release_notes.py).
# The tag must match __version__ in src/feeder_station/__init__.py:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a hyphen (v0.2.0-rc2) makes a pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.13"
  PYINSTALLER: "pyinstaller==6.22.3"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: The tag matches the code's version
        id: version
        run: |
          version=$(uv run --no-sync python -c "import feeder_station; print(feeder_station.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but __version__ is $version"
            exit 1
          fi
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glibc this runner image has, so the binary also runs
          # on older distributions than the one it was built on.
          - os: ubuntu-22.04
            system: Linux
            binary: dist/cicg-estacion
          - os: windows-latest
            system: Windows
            binary: dist/cicg-estacion.exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync --with "${{ env.PYINSTALLER }}" pyinstaller --noconfirm packaging/cicg-estacion.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          "${{ matrix.binary }}" --no-gateway --no-browser --port 8799 --db-path smoke.db > smoke.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8799/api/overview && curl -fsS -o /dev/null http://127.0.0.1:8799/; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          cat smoke.log
          test "$ok" = 1
      - name: Linux files
        if: runner.os == 'Linux'
        run: |
          mkdir -p out "EstacionCICG-$VERSION-Linux"
          cp dist/cicg-estacion "out/EstacionCICG-$VERSION-Linux-Portable"
          cp dist/cicg-estacion packaging/linux/instalar.sh packaging/linux/LEEME.txt "EstacionCICG-$VERSION-Linux/"
          chmod +x "EstacionCICG-$VERSION-Linux/cicg-estacion" "EstacionCICG-$VERSION-Linux/instalar.sh"
          tar czf "out/EstacionCICG-$VERSION-Linux-Instalador.tar.gz" "EstacionCICG-$VERSION-Linux"
          ls -l out
      - name: Windows files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc.FullName "/DAppVersion=$env:VERSION" packaging/cicg-estacion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/cicg-estacion.exe "out/EstacionCICG-$env:VERSION-Windows-Portable.exe"
          Copy-Item "dist/EstacionCICG-$env:VERSION-Windows-Instalador.exe" out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v6
        with:
          name: estacion-${{ matrix.system }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - run: python3 packaging/release_notes.py "${{ needs.test.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Estación CICG ${{ needs.test.outputs.version }}
          body_path: notes.md
          files: assets/*
          # v0.2.0-rc2 and the like: a pre-release, to try the build first.
          prerelease: ${{ contains(github.ref_name, '-') }}
