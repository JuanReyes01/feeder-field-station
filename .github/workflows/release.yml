# Every v* tag: run the tests, build the double-click executable on Linux and
# Windows (packaging/cicg-estacion.spec), smoke-test each one, and attach both
# to the GitHub release for that tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a hyphen (v0.2.0-rc1) makes a pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.13"
  PYINSTALLER: "pyinstaller==6.22.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported glibc this runner image has, so the binary
          # also runs on older distributions than the one it was built on.
          - os: ubuntu-22.04
            name: linux
            binary: dist/cicg-estacion
            asset: cicg-estacion-linux-x86_64
          - os: windows-latest
            name: windows
            binary: dist/cicg-estacion.exe
            asset: cicg-estacion-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync --with "${{ env.PYINSTALLER }}" pyinstaller --noconfirm packaging/cicg-estacion.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          "${{ matrix.binary }}" --no-gateway --no-browser --port 8799 --db-path smoke.db > smoke.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8799/api/overview && curl -fsS -o /dev/null http://127.0.0.1:8799/; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          cat smoke.log
          test "$ok" = 1
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          $version = (uv run --no-sync python -c "import feeder_station; print(feeder_station.__version__)").Trim()
          & $iscc.FullName "/DAppVersion=$version" packaging/cicg-estacion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Collect the assets
        shell: bash
        run: |
          mkdir out
          cp "${{ matrix.binary }}" "out/${{ matrix.asset }}"
          if [ -f dist/cicg-estacion-setup.exe ]; then
            cp dist/cicg-estacion-setup.exe out/cicg-estacion-windows-setup.exe
          fi
          ls -l out
      - uses: actions/upload-artifact@v6
        with:
          name: assets-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          # v0.2.0-rc1 and the like: a pre-release, to try the build first.
          prerelease: ${{ contains(github.ref_name, '-') }}
