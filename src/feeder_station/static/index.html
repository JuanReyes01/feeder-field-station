<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación CICG</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: light;
    --ground: #F3F5F1; --surface: #FFFFFF; --ink: #17211D; --muted: #56635C; --line: #D8DED8;
    --soft: #EDF0ED; --accent: #0A6657; --accent-soft: #DDEEEA; --accent-ink: #084F44;
    --warn: #B4460B; --warn-soft: #FBE9DD; --warn-ink: #7E2F05; --info: #1F5FA8;
    --info-soft: #E3ECF7; --info-ink: #143F70;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-size: 15px; line-height: 1.45;
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout { display: flex; flex-wrap: wrap; min-height: 100vh; align-items: stretch; }
  /* The menu stays in view: the trap switch and the station's state are always at hand. */
  .layout > nav {
    flex: 1 1 200px; background: var(--ink); color: #fff; padding: 20px 14px;
    display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
  }
  .layout > nav .version { display: block; font-size: 12px; font-weight: 400; color: #B9C4BE; margin-top: 2px; }
  .layout > nav .brand { font-size: 18px; font-weight: 600; padding: 0 10px 14px; }
  .layout > nav a {
    display: block; min-height: 44px; padding: 10px; border-radius: 6px; color: #fff;
    text-decoration: none; font-weight: 500;
  }
  .layout > nav a.on { background: #fff; color: var(--ink); }
  .layout > nav .status a { display: inline; min-height: 0; padding: 0; color: inherit; text-decoration: underline; font-weight: 400; }
  .layout > nav .status {
    margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid #3D4A43; font-size: 13px;
    color: #E4EAE6; display: flex; flex-direction: column; gap: 8px;
  }
  .layout > nav .settings-link { border-top: 0; }
  .trap-switch {
    display: flex; flex-direction: column; gap: 6px; padding: 10px; margin: 0 0 10px;
    border: 1px solid #3D4A43; border-radius: 8px;
  }
  .trap-switch .ts-state { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .trap-switch .ts-note, .layout > nav .ts-note { font-size: 12px; color: #B9C4BE; }
  .trap-switch button { width: 100%; min-height: 40px; }
  .layout > nav .danger-outline { background: transparent; color: #FFB596; border-color: #FFB596; }
  .indicator { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot-ok { background: #3FBF8F; }
  .dot-warn { background: #F08A52; }
  .dot-off { background: #7C8A83; }
  main {
    flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .ok { color: var(--accent); }
  .warn { color: var(--warn); }
  .info { color: var(--info); }
  .italic { font-style: italic; }
  .strong { font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .stack > *, .grid-wide > * { min-width: 0; }
  .narrow { max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .grid-wide { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .stat .value { font-size: 28px; font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; white-space: nowrap; }
  td { padding: 10px 8px; border-top: 1px solid var(--soft); vertical-align: middle; }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center; font: inherit;
    min-height: 44px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none;
  }
  button:hover, .button:hover { filter: brightness(.95); }
  button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 600; }
  button.quiet { background: transparent; border-color: #8A968F; min-height: 40px; }
  button.selected { background: var(--ink); color: #fff; }
  button.big { flex: 1 1 130px; min-height: 48px; font-size: 16px; }
  .toggle {
    width: 100%; justify-content: space-between; gap: 12px; text-align: left; min-height: 48px;
    border-color: #8A968F; margin-bottom: 8px;
  }
  .toggle.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .banner {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px; border-radius: 6px;
  }
  .banner .title { font-size: 18px; font-weight: 600; }
  .banner-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .banner-info { background: var(--info-soft); color: var(--info-ink); }
  .banner-ok { background: var(--accent-soft); color: var(--accent-ink); }
  .state { font-size: 34px; font-weight: 600; line-height: 1.2; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--soft); }
  .line > :last-child { text-align: right; font-weight: 500; }
  .event { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 0; border-top: 1px solid var(--soft); }
  .event .time { flex: 0 0 74px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .event .kind { flex: 0 0 84px; font-size: 13px; font-weight: 600; }
  .event .text { flex: 1 1 240px; }
  .step { display: flex; flex-direction: column; gap: 8px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea {
    min-height: 44px; padding: 8px 12px; border: 1px solid #8A968F; border-radius: 6px;
    font: inherit; font-size: 16px; background: var(--surface); color: var(--ink);
  }
  textarea { resize: vertical; font-family: var(--mono); font-size: 15px; }
  /* A long option must not widen its field past the row. */
  .row > label { min-width: 0; }
  label > select, label > input:not([type=checkbox]) { width: 100%; min-width: 0; }
  input[type=checkbox] { width: 24px; height: 24px; min-height: 0; }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; background: var(--soft); color: var(--muted); }
  .chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.info { background: var(--info-soft); color: var(--info-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .check { flex-direction: row; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
  code { font-family: var(--mono); font-size: 13px; background: var(--soft); padding: 2px 6px; border-radius: 4px; }
  .hidden-file { position: absolute; left: -9999px; }
  /* A secondary action that lets go of something: releases a trap or takes individuals off. */
  button.danger-outline { background: var(--surface); color: var(--warn); border-color: var(--warn); }
  /* Tabs move between a trap's sections; they are links, drawn as tabs. */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; color: var(--muted);
    text-decoration: none; font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  /* One choice among a few: a period, a kind of event, a trap's type. */
  .segmented { display: inline-flex; flex-wrap: wrap; border: 1px solid #8A968F; border-radius: 6px; overflow: hidden; }
  .segmented button { border: 0; border-radius: 0; border-right: 1px solid #8A968F; min-height: 42px; background: var(--surface); }
  .segmented button:last-child { border-right: 0; }
  .segmented button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .crumbs a { color: var(--accent-ink); }
  main a:not(.button):not(.bar-row):not(.tab) { color: var(--accent-ink); }
  .file-button { color: var(--ink); flex-direction: row; font-size: 15px; }
  /* On or off, said and shown the same way everywhere. */
  .switch {
    display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; color: inherit;
    padding: 4px 0; min-height: 36px; justify-content: flex-start; font-size: inherit; text-align: left;
  }
  .switch-track { width: 38px; height: 22px; border-radius: 11px; background: #7C8A83; position: relative; flex: 0 0 auto; transition: background .15s; }
  .switch-thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch[aria-checked="true"] .switch-track { background: #2E9E78; }
  .switch[aria-checked="true"] .switch-thumb { left: 19px; }
  .switch-light { font-size: 15px; color: var(--ink); }
  .switch-light .switch-track { background: #B9C2BD; }
  .switch-light[aria-checked="true"] .switch-track { background: var(--accent); }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
    width: min(640px, calc(100vw - 32px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 12px 14px; border-radius: 8px; background: var(--ink); color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  .toast[hidden] { display: none; }
  .toast .toast-text { flex: 1 1 260px; }
  .toast button { min-height: 38px; background: transparent; color: #fff; border-color: #8FA59A; }
  .toast-error { background: var(--warn-ink); }
  dialog {
    border: 0; border-radius: 10px; padding: 20px; width: min(460px, calc(100vw - 32px));
    color: var(--ink); background: var(--surface); box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(23,33,29,.45); }
  /* Charts, drawn by hand: the station works offline, with no library to load. */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; align-items: start; }
  .charts.two { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
  .charts > * { min-width: 0; }
  .charts .full { grid-column: 1 / -1; }
  /* One grid for all the rows, so every track starts and ends at the same place. */
  .bars { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(36px, 1fr) auto; row-gap: 2px; }
  .bar-row {
    grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; gap: 10px;
    align-items: center; min-height: 34px; padding: 4px 6px; border-radius: 4px; color: inherit;
    text-decoration: none; text-align: left; width: 100%;
  }
  button.bar-row { border: 0; background: transparent; font-size: 14px; min-height: 36px; justify-content: stretch; }
  button.bar-row:hover, a.bar-row:hover { background: var(--soft); filter: none; }
  button.bar-row.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 12px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar-fill.over { background: var(--warn); }
  .bar-value { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .columns { display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); }
  .column-slot { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
  .column { display: block; width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; }
  .column-axis { display: flex; gap: 2px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .column-axis span { flex: 1 1 0; min-width: 0; white-space: nowrap; }
  .chart-note { font-size: 12px; color: var(--muted); }
  .spark { color: var(--accent); display: block; }
  .spark .dot { fill: var(--accent); }
  .spark .dot-warn { fill: var(--warn); }
  .stat .label { font-size: 13px; color: var(--muted); }
  .stat .value.small-value { font-size: 18px; }
  .stat .note { font-size: 13px; color: var(--muted); margin-top: 2px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.flagged td { background: var(--warn-soft); }
  .capture-head {
    width: 100%; justify-content: space-between; gap: 12px; text-align: left; border-color: var(--line);
    flex-wrap: wrap; min-height: 52px;
  }
  .capture-head.open { border-color: var(--accent); background: var(--accent-soft); }
  .capture-body { padding: 4px 4px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 4px 24px; }
  .capture-body h3 { margin: 10px 0 2px; font-size: 14px; font-weight: 600; grid-column: 1 / -1; }
  .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .section-head h2 { margin: 0; }
  @media (max-width: 720px) {
    /* On a phone the menu is a compact bar on top, not a column before the content. */
    .layout > nav {
      position: static; height: auto; flex: 1 1 100%; flex-direction: row; flex-wrap: wrap;
      align-items: center; gap: 6px; padding: 12px 16px;
    }
    .layout > nav .brand { flex: 1 1 100%; padding: 0 0 4px; }
    .layout > nav .version { display: inline; margin-left: 6px; }
    .layout > nav a { min-height: 40px; padding: 8px 12px; border: 1px solid #3D4A43; }
    .trap-switch { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; align-items: center; margin: 0 0 4px; }
    .trap-switch .ts-state { flex: 1 1 auto; }
    .trap-switch button { width: auto; flex: 0 0 auto; }
    .layout > nav .status { flex: 1 1 100%; margin-top: 4px; padding: 8px 0 0; flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
    main { padding: 16px; }
  }
</style>
<div class="layout">
  <nav aria-label="Secciones">
    <div class="brand">Estación CICG <span class="version" id="nav-version"></span></div>
    <div class="trap-switch" id="trap-switch"></div>
    <a href="#/inicio" data-nav="inicio">Inicio</a>
    <a href="#/individuos" data-nav="individuos">Individuos</a>
    <a href="#/visitas" data-nav="visitas">Visitas</a>
    <a href="#/capturas" data-nav="capturas">Capturas</a>
    <a href="#/bitacora" data-nav="bitacora">Bitácora</a>
    <div class="status" id="nav-status">Cargando…</div>
    <a href="#/estacion" data-nav="estacion" class="settings-link">Estación</a>
  </nav>
  <main>
    <div id="banners" class="stack"></div>
    <div id="screen" class="stack">Cargando…</div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="confirm" aria-label="Confirmar"></dialog>
<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

const STATE_ES = { idle: "Suelta", armed: "Armada", fired: "Disparada", fault: "Con fallo" };
const KIND_ES = {
  reads: ["Lectura", "muted"], captures: ["Captura", "warn"], commands: ["Comando", "ok"],
  faults: ["Fallo", "warn"], connections: ["Conexión", "info"],
};
const FILTERS = [
  ["all", "Todo"], ["captures", "Capturas"], ["commands", "Comandos"], ["faults", "Fallos"],
  ["connections", "Conexiones"], ["reads", "Lecturas"],
];
const PERIODS = [["1", "Hoy"], ["7", "Últimos 7 días"], ["30", "Últimos 30 días"], ["36500", "Todo"]];
const TRAP_TABS = {
  prep: "Preparar", control: "Control", config: "Configuración", list: "Lista de interés",
  visits: "Visitas", log: "Bitácora",
};

const data = { overview: null, health: null, specimens: null, gateway: null, update: null, station: null };
const ui = {
  filter: "all", period: "1", visitTrap: "", trapSearch: "", updateHidden: false,
  filters: { species: "", project: "", locality: "", sex: "", age: "", from: "", to: "", text: "", status: "" }, scope: "all", entries: "",
  // Details only when asked for: lists, tables and each capture stay closed.
  showList: false, showUnknown: false, showAdd: false, showVisits: false, showBirdVisits: false,
  editBird: false, openCaptures: new Set(), visitTotal: null, threshold: 10,
};
try { ui.threshold = Number(localStorage.getItem("measureThreshold")) || 10; } catch (_) { /* default */ }

function toggleUi(name) { ui[name] = !ui[name]; render(true); }

// The real list has more than a thousand individuals: a screen shows what
// matters and search reaches the rest.
const MAX_LISTED = 100;
const MAX_SEARCH_RESULTS = 20;
const VISITS_LISTED = 300; // /api/visits' own default limit

function matchesSearch(s, text) {
  const q = text.trim().toLowerCase();
  return !q || [s.biomark, s.tag, s.species, s.band_number, s.cicg_id].some((v) => (v || "").toLowerCase().includes(q));
}

// Lists load after the page paints. Showing the last answer for the same list
// right away keeps a 5 s refresh from flickering through "Cargando…", and the
// newest request wins, so a slow answer can't paint over another screen.
const lastHtml = new Map();
const newestLoad = new Map();

async function loadInto(targetId, url, toHtml) {
  const key = `${targetId}:${url}`;
  const target = $(targetId);
  if (target && lastHtml.has(key)) {
    target.classList.remove("muted");
    target.innerHTML = lastHtml.get(key);
  }
  newestLoad.set(targetId, key);
  let html;
  try { html = toHtml(await api(url)); } catch (_) { return; }
  lastHtml.set(key, html);
  const current = $(targetId);
  if (!current || newestLoad.get(targetId) !== key) return;
  current.classList.remove("muted");
  current.innerHTML = html;
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return { screen: parts[0] || "inicio", id: parts[1], tab: parts[2] };
}

function clockTime(epoch) {
  if (epoch === null || epoch === undefined) return "—";
  return new Date(epoch * 1000).toLocaleTimeString("es-CO", { hour12: false });
}

function dateTime(epoch) {
  const when = new Date(epoch * 1000);
  const sameDay = when.toDateString() === new Date().toDateString();
  return sameDay ? clockTime(epoch) : `${when.toLocaleDateString("es-CO")} ${clockTime(epoch)}`;
}

function ago(iso) {
  if (!iso) return "Nunca";
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - new Date(iso).getTime() / 1000));
  if (seconds < 60) return `Hace ${seconds} s`;
  if (seconds < 3600) return `Hace ${Math.round(seconds / 60)} min`;
  if (seconds < 86400) return `Hace ${Math.round(seconds / 3600)} h`;
  return `Hace ${Math.round(seconds / 86400)} d`;
}

function duration(seconds) {
  if (seconds < 60) return `${Math.round(seconds)} s`;
  return `${Math.floor(seconds / 60)} min ${Math.round(seconds % 60)} s`;
}

function trapById(id) {
  return (data.overview?.traps || []).find((t) => String(t.node_id) === String(id));
}

function trapCode(id) { return Number(id).toString(16).toUpperCase().padStart(4, "0"); }

function trapName(id) { return trapById(id)?.name || `Trampa ${trapCode(id)}`; }

function isPrepared(t) { return t.setup_done; }

function stateLabel(t) {
  if (t.has_latch === false) return "Solo lector";
  if (!t.state) return "Sin reporte";
  return STATE_ES[t.state] || t.state;
}

function stateClass(t) {
  if (t.state === "fired" || t.state === "fault" || !t.reachable) return "warn";
  return t.state === "armed" ? "ok" : "";
}

function clockNote(t) {
  if (!t.clock_epoch || t.clock_source === 0) return ["Sin hora", "warn"];
  const offset = Math.round(t.clock_offset_s ?? 0);
  if (Math.abs(offset) <= 5) return ["Sincronizada", "ok"];
  return [`${offset > 0 ? "Adelantada" : "Atrasada"} ${Math.abs(offset)} s`, "warn"];
}

function listNote(t) {
  if (t.pending_command === "set_targets") {
    return t.reachable ? ["Enviando a la trampa…", "info"] : ["Sin conexión; la recibe al conectarse", "warn"];
  }
  if (t.targets_match === true) return ["Confirmada por la trampa", "ok"];
  if (t.targets_match === false) return ["Distinta en la trampa; se corrige sola", "warn"];
  return ["Sin confirmar todavía", "muted"];
}

function count(n, one, many) { return `${n} ${n === 1 ? one : many}`; }

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = "No se pudo completar.";
    try {
      const body = await response.json();
      if (typeof body.detail === "string") detail = body.detail;
    } catch (_) { /* a body that is not JSON keeps the generic message */ }
    throw new Error(detail);
  }
  return response.json();
}

// --- Feedback where the operator is looking ----------------------------------
// The result of an action shows at the bottom of the screen, wherever the page
// was scrolled, with "Deshacer" when it can be undone. Errors stay until closed.
const toastState = { timer: null, undo: null };

function toast(text, { undo = null, error = false } = {}) {
  const box = $("toast");
  clearTimeout(toastState.timer);
  toastState.undo = undo;
  box.className = `toast${error ? " toast-error" : ""}`;
  box.setAttribute("role", error ? "alert" : "status");
  box.innerHTML = `<span class="toast-text">${escapeHtml(text)}</span>
    ${undo ? '<button onclick="undoLast()">Deshacer</button>' : ""}
    <button class="quiet" onclick="hideToast()">Cerrar</button>`;
  box.hidden = false;
  if (!error) toastState.timer = setTimeout(hideToast, undo ? 12000 : 6000);
}

function hideToast() { $("toast").hidden = true; toastState.undo = null; }

async function undoLast() {
  const undo = toastState.undo;
  hideToast();
  if (undo) await undo();
}

// A question before what cannot be taken back with "Deshacer".
function confirmAction({ title, text, ok, danger = false }) {
  const dialog = $("confirm");
  dialog.innerHTML = `<form method="dialog" class="stack" style="gap:12px">
    <h2 style="margin:0">${escapeHtml(title)}</h2>
    <p style="margin:0">${escapeHtml(text)}</p>
    <div class="row" style="justify-content:flex-end"><button value="no">Cancelar</button>
      <button value="yes" class="${danger ? "danger" : "primary"}">${escapeHtml(ok)}</button></div></form>`;
  dialog.returnValue = "";
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "yes"), { once: true });
    dialog.showModal();
  });
}

// `done`: what to tell the operator when it worked (text, or made from the answer).
async function act(path, options, done) {
  try {
    const result = await api(path, options);
    if (done) toast(typeof done === "function" ? done(result) : done);
    await refresh(true);
    return result;
  } catch (error) {
    toast(error.message, { error: true });
    render(true);
    return null;
  }
}

// The CICG's database is written in English; the page speaks Spanish. Only
// what is shown changes: filters and the data keep the database's words.
const VALUE_ES = {
  male: "Macho", female: "Hembra", "fem-like-male": "Macho con plumaje de hembra",
  unknown: "Desconocido", adult: "Adulto", juvenile: "Juvenil", immature: "Inmaduro",
};

function es(value) { return value ? (VALUE_ES[String(value).trim().toLowerCase()] || value) : value; }

// --- Individuals: a bird is its CICG code ----------------------------------
// The station keeps tags, and a bird may have worn several: a tag can fall
// off. What the operator sees and counts is the bird; what a trap hunts is the
// tag it wears now ("en uso").
let birdIndex = { source: null, list: [], byKey: new Map(), byTag: new Map(), byCode: new Map() };

function birdKey(s) {
  const code = (s.cicg_id || "").trim().toLowerCase();
  return s.registered && code ? `cicg:${code}` : `tag:${s.tag}`;
}

function makeBird(key, rows) {
  const last = (s) => s.capture_days.at(-1) || "";
  const inUse = rows.filter((s) => !s.replaced);
  const main = (inUse.length ? inUse : rows).slice()
    .sort((a, b) => last(b).localeCompare(last(a)) || a.tag.localeCompare(b.tag))[0];
  const captures = rows.flatMap((s) => s.captures.map((c) => ({ ...c, tag: s.tag, biomark: s.biomark })))
    .sort((a, b) => a.day.localeCompare(b.day));
  return {
    key, rows, inUse, main, lost: rows.filter((s) => s.replaced),
    code: main.cicg_id || null, name: main.cicg_id || main.biomark,
    species: main.species, sex: main.sex, age: main.age, band_number: main.band_number,
    tag: main.tag, biomark: main.biomark, captures,
    capture_days: [...new Set(captures.map((c) => c.day))].sort(),
    times_seen: rows.reduce((n, s) => n + s.times_seen, 0),
  };
}

function birds() {
  if (birdIndex.source === data.specimens) return birdIndex.list;
  const groups = new Map();
  for (const s of registeredSubjects()) {
    const key = birdKey(s);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  const list = [...groups].map(([key, rows]) => makeBird(key, rows));
  const byTag = new Map();
  const byCode = new Map();
  for (const b of list) {
    for (const s of b.rows) byTag.set(s.tag, b);
    if (b.code) byCode.set(b.code.trim().toLowerCase(), b);
  }
  birdIndex = { source: data.specimens, list, byKey: new Map(list.map((b) => [b.key, b])), byTag, byCode };
  return list;
}

function birdByKey(key) { birds(); return birdIndex.byKey.get(key) || null; }
function birdByTag(tag) { birds(); return birdIndex.byTag.get(tag) || null; }

// A CICG code, a tag in hex or a BioMark: the bird it belongs to.
function birdOf(id) {
  birds();
  const text = String(id || "").trim();
  return birdIndex.byCode.get(text.toLowerCase()) || birdIndex.byTag.get(text.toUpperCase())
    || birdIndex.list.find((b) => b.rows.some((s) => s.biomark === text)) || null;
}

function birdHref(b) { return `#/individuo/${encodeURIComponent(b.code || b.tag)}`; }

// A tag as the API describes it (known, label, cicg_id, lost_tag), in words.
function tagName(fields) {
  if (!fields?.known) return "Lectura desconocida";
  return `${fields.cicg_id ? `${fields.cicg_id} · ` : ""}${fields.label}`;
}

function lostChip(fields) { return fields?.lost_tag ? ' <span class="chip warn">tag perdido</span>' : ""; }

function anyMark(s) { return s.all_traps || s.trap_ids.length > 0; }
// null is "todas las trampas".
function markedIn(s, nodeId) { return nodeId === null ? s.all_traps : isOfInterest(s, nodeId); }
// The bird is wanted in a trap when every tag it wears is.
function birdWanted(b, nodeId) { return b.inUse.length > 0 && b.inUse.every((s) => markedIn(s, nodeId)); }
function birdMarked(b) { return b.rows.some(anyMark); }
function lostStillMarked(b) { return b.lost.filter(anyMark); }

function scopeLabel(nodeId) { return nodeId === null ? "todas las trampas" : trapName(nodeId); }

function changeSummary(result, action, nodeId) {
  const n = result.changed;
  const verb = action === "add" ? (n === 1 ? "Marcado" : "Marcados") : (n === 1 ? "Quitado" : "Quitados");
  const parts = [n ? `${verb} ${count(n, "tag", "tags")} en ${scopeLabel(nodeId)}.` : "Nada cambió."];
  if (result.unchanged) parts.push(`${result.unchanged} ya ${result.unchanged === 1 ? "estaba" : "estaban"} así.`);
  if (result.created.length) parts.push(`Registrados como nuevos: ${result.created.join(", ")}.`);
  if (result.missing.length) parts.push(`No encontrados: ${result.missing.join(", ")}.`);
  if (result.ambiguous.length) parts.push(`Anillo de varios individuos, usa el código CICG: ${result.ambiguous.join(", ")}.`);
  return parts.join(" ");
}

// Every change of interest can be undone: each tag goes back to where it was.
async function changeInterest(action, body) {
  const nodeId = body.node_id !== undefined ? body.node_id : scopeId();
  const before = new Map((data.specimens?.specimens || []).map((s) => [s.tag, { all_traps: s.all_traps, node_ids: s.trap_ids.slice() }]));
  const result = await act("/api/specimens/interest/change", jsonBody("POST", { action, ...body, node_id: nodeId }));
  if (!result) return null;
  const changed = result.changed_tags || [];
  toast(changeSummary(result, action, nodeId), { undo: changed.length ? () => restoreInterest(changed, before) : null });
  return result;
}

async function restoreInterest(tags, before) {
  const groups = new Map();
  for (const tag of tags) {
    const was = before.get(tag) || { all_traps: false, node_ids: [] };
    const key = JSON.stringify(was);
    if (!groups.has(key)) groups.set(key, { ...was, tags: [] });
    groups.get(key).tags.push(tag);
  }
  for (const group of groups.values()) {
    if (!(await act("/api/specimens/interest", jsonBody("POST", group)))) return;
  }
  toast("Deshecho: las trampas vuelven a como estaban.");
}

// A bird on or off a trap (or all of them), from its page or a trap's list.
function toggleBird(key, nodeId) {
  const b = birdByKey(key);
  if (!b) return null;
  const node = nodeId === null ? null : Number(nodeId);
  if (birdWanted(b, node)) {
    return changeInterest("remove", { node_id: node, tags: b.rows.filter((s) => markedIn(s, node)).map((s) => s.tag) });
  }
  return changeInterest("add", { node_id: node, tags: b.inUse.map((s) => s.tag) });
}

function unmarkLost(key) {
  const b = birdByKey(key);
  return b ? changeInterest("remove", { node_id: null, tags: lostStillMarked(b).map((s) => s.tag) }) : null;
}

// A tag that is no bird yet (an unknown reading).
function markTag(tag) { return changeInterest("add", { tags: [tag] }); }

async function importExcel(input) {

  if (result.replaced) parts.push(`${count(result.replaced, "tag perdido", "tags perdidos")} (el colibrí ya lleva otro).`);
  if (result.without_tag) parts.push(`${count(result.without_tag, "fila sin PIT se omitió", "filas sin PIT se omitieron")}: sin tag no hay lectura.`);
  if (result.error_count) parts.push(`${count(result.error_count, "fila", "filas")} sin importar: ${result.errors.slice(0, 3).join(" ")}`);
  if (result.warning_count) parts.push(`${count(result.warning_count, "aviso", "avisos")}: ${result.warnings.slice(0, 3).join(" ")}`);

// One list per trap: who the station wants there and what the trap has, by bird.
function trapBirds(t) {
  birds();
  const wanted = new Set((t.wanted || []).map((w) => w.tag));
  const reported = new Set((t.reported || []).map((r) => r.tag));
  const entries = new Map();
  for (const tag of new Set([...wanted, ...reported])) {
    const b = birdByTag(tag);
    const key = b ? b.key : `tag:${tag}`;
    if (!entries.has(key)) entries.set(key, { b, tag, tags: [] });
    entries.get(key).tags.push(tag);
  }
  return [...entries.values()].map((e) => {
    const isWanted = e.tags.some((tag) => wanted.has(tag));
    const inTrap = e.tags.filter((tag) => wanted.has(tag)).every((tag) => reported.has(tag));
    let status;
    if (isWanted && inTrap) status = ["En la trampa", "ok"];
    else if (isWanted) status = t.reachable ? ["Enviando…", "info"] : ["La recibe al conectarse", "warn"];
    else status = t.reachable ? ["Saliendo…", "info"] : ["La quita al conectarse", "warn"];
    const lost = e.b ? e.b.lost.some((s) => e.tags.includes(s.tag)) : false;
    return { ...e, isWanted, status, lost, removeTags: e.tags.filter((tag) => wanted.has(tag)) };
  }).sort((x, y) => (x.b?.name || x.tag).localeCompare(y.b?.name || y.tag));
}

function removeFromTrap(nodeId, tags) {
  return changeInterest("remove", { node_id: Number(nodeId), tags: tags.split(",") });
}

function addToTrap(nodeId, key) {
  const b = birdByKey(key);
  return b ? changeInterest("add", { node_id: Number(nodeId), tags: b.inUse.map((s) => s.tag) }) : null;
}

function trapSearchRows(t) {

  if (!shown.length) return '<p class="small muted" style="margin:8px 0 0">Ningún individuo sin marcar coincide.</p>';
  return shown.map((b) => `<div class="row between" style="border-top:1px solid var(--soft);padding:6px 0">
    <span><span class="strong">${escapeHtml(b.code || b.biomark)}</span> · <span class="italic">${escapeHtml(b.species || "Sin especie")}</span><span class="mono small muted"> · ${escapeHtml(b.inUse.map((s) => s.biomark).join(", "))}</span></span>
    <button class="quiet" onclick="addToTrap(${t.node_id}, '${b.key}')">Agregar</button></div>`).join("")

function visitSummaryHtml(s) {
  ui.visitTotal = s.visits;

  const card = (title, body, note, css = "") => `<div class="card ${css}"><h2>${title}</h2>${body}${note ? `<p class="small muted" style="margin:8px 0 0">${note}</p>` : ""}</div>`;
  const hours = columns(s.by_hour, s.by_hour.map((_, h) => String(h)), { every: 3, titles: s.by_hour.map((n, h) => `${h}:00 a ${h}:59: ${count(n, "visita", "visitas")}`) });
  let days = "";
  if (s.by_day.length > 1) {
    if (s.by_day.length > MAX_DAY_COLUMNS) {
      const months = new Map();
      for (const d of s.by_day) months.set(d.day.slice(0, 7), (months.get(d.day.slice(0, 7)) || 0) + d.visits);
      const keys = [...months.keys()];
      days = card("Visitas por mes", columns(keys.map((k) => months.get(k)), keys.map(monthLabel), { every: Math.max(1, Math.ceil(keys.length / 5)) }));
    } else {
      days = card("Visitas por día", columns(s.by_day.map((d) => d.visits), s.by_day.map((d) => `${Number(d.day.slice(8))}/${Number(d.day.slice(5, 7))}`), {
        every: Math.max(1, Math.ceil(s.by_day.length / 7)),
        titles: s.by_day.map((d) => `${dayLabel(d.day)}: ${count(d.visits, "visita", "visitas")}, ${count(d.subjects, "individuo", "individuos")}`),
      }));
    }
  }
  const top = hbars(s.top.map((t) => ({
    label: `${tagName(t)}${t.lost_tag ? " (tag perdido)" : ""} · ${t.biomark}`,
    value: t.visits,
    text: `${count(t.visits, "visita", "visitas")} · última ${whenLong(t.last_epoch).replace(/^Hoy/, "hoy")}`,
    href: `#/individuo/${encodeURIComponent(t.known && t.cicg_id ? t.cicg_id : t.tag)}`,
  })));
  const species = hbars(s.by_species.map((x) => ({ label: x.label, value: x.visits, text: `${x.visits} · ${x.subjects} ind.` })));
  const nodes = !ui.visitTrap && s.by_node.length > 1
    ? card("Por trampa", hbars(s.by_node.map((n) => ({ label: trapName(n.node_id), value: n.visits, text: `${n.visits} · ${n.subjects} ind.` }))))
    : "";
  return `
    <div class="grid">
      ${stat("Visitas", fmt(s.visits, 0))}
      ${stat("Individuos", fmt(s.subjects, 0), "del CICG, por código")}
      ${stat("Lecturas", fmt(s.reads, 0))}
      ${stat("Duración mediana", s.median_duration_s === null ? "—" : duration(s.median_duration_s))}
      ${stat("Lecturas desconocidas", fmt(s.unknown_visits, 0), count(s.unknown_tags, "tag fuera de la base", "tags fuera de la base"))}
      ${stat("Con hora dudosa", pct(s.untrusted_visits / s.visits, 0), count(s.untrusted_visits, "visita", "visitas"))}
    </div>
    <div class="charts two">
      ${card("Visitas por hora del día", hours)}
      ${days}
      ${card("Individuos con más visitas", top, "Clic en uno para abrir su página.", "full")}
      ${card("Por especie", species)}
      ${nodes}
    </div>`;
}

function birdInterest(b) {
  if (!b.inUse.length) return ["Sin tag en uso: no se puede marcar", "warn"];
  if (birdWanted(b, null)) return ["De interés en todas", "ok"];
  const at = (data.overview?.traps || []).filter((t) => birdWanted(b, t.node_id)).map((t) => t.name);
  if (at.length) return [`De interés en ${at.join(" y ")}`, "ok"];
  return ["Sin marcar", "muted"];
}

// Individuos: the CICG's birds filtered down to who to mark. The buttons act on
// exactly what the filters show, in the traps the "Dónde" selector names.
const NO_FILTERS = { species: "", project: "", locality: "", sex: "", age: "", from: "", to: "", text: "", status: "" };
const NO_SPECIES = "__none__";

function interestLimit() { return data.specimens?.of_interest_limit ?? 78; }

function scopeId() { return ui.scope === "all" ? null : Number(ui.scope); }

function scopeName() { return scopeLabel(scopeId()); }

// Wanted where the selector points: every tag the bird wears, in all or in that trap.
function wantedInScope(b) { return birdWanted(b, scopeId()); }

function markedInScope(s) { return ui.scope === "all" ? anyMark(s) : isOfInterest(s, ui.scope); }

// What "Quitar" would change: any of the bird's tags, a lost one included.
function removableInScope(b) { return b.rows.some(markedInScope); }

function tagsToAdd(list) {
  const nodeId = scopeId();
  return list.flatMap((b) => b.inUse.filter((s) => !markedIn(s, nodeId))).map((s) => s.tag);
}

function tagsToRemove(list) { return list.flatMap((b) => b.rows.filter(markedInScope)).map((s) => s.tag); }

function dayLabel(day) {
  return new Date(`${day}T00:00:00`).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
}

function registeredSubjects() { return (data.specimens?.specimens || []).filter((s) => s.registered); }

// Project, locality and dates must hold for one same capture: "captured in
// Zona alta in 2026" is one capture, not one of each. Any tag the bird wore counts.
function captureMatches(c, f) {
  return (!f.project || c.project === f.project) && (!f.locality || c.locality === f.locality)
    && (!f.from || c.day >= f.from) && (!f.to || c.day <= f.to);
}

// "Todos" means birds wearing a tag a trap can read.
const STATUS_TEST = {
  "": (b) => b.inUse.length > 0,
  marked: birdMarked,
  unmarked: (b) => b.inUse.length > 0 && !birdMarked(b),
  changed: (b) => b.rows.length > 1,
  notag: (b) => b.inUse.length === 0,
};

function matchesBird(b, text) {
  const q = text.trim().toLowerCase();
  return !q || [b.code, b.species, b.band_number].some((v) => (v || "").toLowerCase().includes(q))
    || b.rows.some((s) => matchesSearch(s, q));
}

function filteredBirds() {
  const f = ui.filters;
  const byCapture = f.project || f.locality || f.from || f.to;
  return birds().filter((b) => (!f.species || (f.species === NO_SPECIES ? !b.species : b.species === f.species))
    && (!f.sex || b.sex === f.sex) && (!f.age || b.age === f.age)
    && (!byCapture || b.captures.some((c) => captureMatches(c, f)))
    && (STATUS_TEST[f.status || ""] || STATUS_TEST[""])(b)
    && matchesBird(b, f.text))
    .sort((a, b) => (b.capture_days.at(-1) || "").localeCompare(a.capture_days.at(-1) || "") || a.name.localeCompare(b.name));
}

// The fullest list after adding these tags, mirroring the station's own check:
// each known trap, plus a trap that connects later when marking in all.
function fullestAfterAdding(tags) {
  const adding = new Set(tags);
  const all = data.specimens?.specimens || [];
  const ids = ui.scope === "all" ? (data.overview?.traps || []).map((t) => t.node_id).concat(null) : [scopeId()];
  return ids.map((id) => ({
    id,
    count: all.filter((s) => adding.has(s.tag) || (id === null ? s.all_traps : isOfInterest(s, id))).length,
  })).sort((a, b) => b.count - a.count)[0];
}

// Where a bird stands in each trap: what the trap itself reported, not what
// the station asked for.
function syncChips(b) {
  const traps = data.overview?.traps || [];
  const chips = [];
  for (const t of traps) {
    const reported = (tag) => (t.reported || []).some((r) => r.tag === tag);
    const wanted = birdWanted(b, t.node_id);
    if (wanted && b.inUse.every((s) => reported(s.tag))) chips.push([`En ${t.name}`, "ok"]);
    else if (wanted) chips.push(t.reachable ? [`Enviando a ${t.name}…`, "info"] : [`${t.name}: lo recibe al conectarse`, "warn"]);
    else if (b.rows.some((s) => reported(s.tag))) chips.push(t.reachable ? [`Saliendo de ${t.name}…`, "info"] : [`${t.name}: lo quita al conectarse`, "warn"]);
  }
  if (birdWanted(b, null) && !traps.length) chips.push(["Todas las trampas, al conectarse", ""]);
  if (lostStillMarked(b).length) chips.push(["Un tag perdido sigue marcado", "warn"]);
  return chips.map(([text, css]) => `<span class="chip ${css}">${escapeHtml(text)}</span>`).join(" ");
}

function markOne(key) { const b = birdByKey(key); return b ? changeInterest("add", { tags: tagsToAdd([b]) }) : null; }
function unmarkOne(key) { const b = birdByKey(key); return b ? changeInterest("remove", { tags: tagsToRemove([b]) }) : null; }

function markFiltered(action) {
  const list = filteredBirds();
  const tags = action === "add" ? tagsToAdd(list) : tagsToRemove(list);
  return tags.length ? changeInterest(action, { tags }) : null;
}

async function markEntries(action) {
  const entries = ui.entries.split(/[\s,;]+/).filter(Boolean);
  if (!entries.length) { toast("Escribe o pega al menos un código CICG, biomark o anillo.", { error: true }); return; }
  const result = await changeInterest(action, { entries });
  if (result && !result.missing.length && !result.ambiguous.length) ui.entries = "";
  render(true);
}

function setScope(value) { ui.scope = value; document.activeElement?.blur(); render(true); }
function setFilterValue(name, value) {
  ui.filters = { ...ui.filters, [name]: value };
  if (name === "text") renderFilterResults(); else { document.activeElement?.blur(); render(true); }
}
function clearFilters() { ui.filters = { ...NO_FILTERS }; render(true); }


function filterOptions(values, selected, anyLabel, label) {
  return [`<option value="">${anyLabel}</option>`].concat(values.map(([value, n]) => `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(label(value))} (${n})</option>`)).join("");
}

function tally(values) {
  const counts = new Map();
  for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
  return [...counts];
}

// --- Charts and figures ------------------------------------------------------

function fmt(value, digits = 2) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
  return Number(value).toLocaleString("es-CO", { maximumFractionDigits: digits });
}

function pct(fraction, digits = 1) {
  return fraction === null || fraction === undefined ? "—" : `${fmt(fraction * 100, digits)} %`;
}

function stat(label, value, note, small) {
  return `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value ${small ? "small-value" : ""}">${escapeHtml(value)}</div>${note ? `<div class="note">${escapeHtml(note)}</div>` : ""}</div>`;
}

// Horizontal bars. With `pick` (a filter's name) each bar is a button: a click
// filters by it, a second click on the chosen one takes the filter off.
function hbars(items, { pick, selected, max, warnAbove } = {}) {
  if (!items.length) return '<p class="small muted" style="margin:0">Sin datos.</p>';
  const top = max ?? Math.max(...items.map((i) => i.value), 1);
  return `<div class="bars">${items.map((i) => {
    const width = Math.max(0, Math.min(100, (i.value / top) * 100));
    const over = warnAbove !== undefined && i.value > warnAbove;
    const inner = `<span class="bar-label" title="${escapeHtml(i.label)}">${escapeHtml(i.label)}</span>
      <span class="bar-track"><span class="bar-fill ${over ? "over" : ""}" style="width:${width.toFixed(1)}%"></span></span>
      <span class="bar-value">${escapeHtml(i.text ?? fmt(i.value, 0))}</span>`;
    if (i.href) return `<a class="bar-row" href="${escapeHtml(i.href)}">${inner}</a>`;
    if (!pick || i.key === undefined) return `<div class="bar-row">${inner}</div>`;
    const on = selected === i.key;
    return `<button class="bar-row ${on ? "on" : ""}" aria-pressed="${on}" onclick="pickFilter('${pick}', ${escapeHtml(JSON.stringify(i.key))})">${inner}</button>`;
  }).join("")}</div>`;
}

// Columns for a series in time: hours of the day, days, months.
function columns(values, labels, { every = 1, height = 110, titles } = {}) {
  const top = Math.max(...values, 1);
  return `<div class="columns" style="height:${height}px" role="img" aria-label="${escapeHtml(labels[0] || "")} a ${escapeHtml(labels.at(-1) || "")}">${values.map((v, i) => `<span class="column-slot" title="${escapeHtml(titles ? titles[i] : `${labels[i]}: ${v}`)}"><span class="column" style="height:${((v / top) * 100).toFixed(1)}%"></span></span>`).join("")}</div>
    <div class="column-axis">${labels.map((l, i) => `<span>${i % every === 0 ? escapeHtml(l) : ""}</span>`).join("")}</div>
    <div class="chart-note">Máximo: ${fmt(Math.max(...values, 0), 0)}</div>`;
}

function monthLabel(key) {
  const [year, month] = key.split("-").map(Number);
  return new Date(year, month - 1, 1).toLocaleDateString("es-CO", { month: "short", year: "2-digit" });
}

// Counts per month from ISO days, every month in between included; per year
// when the span is too long to read month by month.
function byMonth(days) {
  if (!days.length) return { values: [], labels: [] };
  const sorted = days.slice().sort();
  const [y0, m0] = sorted[0].slice(0, 7).split("-").map(Number);
  const [y1, m1] = sorted.at(-1).slice(0, 7).split("-").map(Number);
  const months = (y1 - y0) * 12 + (m1 - m0) + 1;
  const counts = new Map();
  if (months > 48) {
    for (const d of sorted) counts.set(d.slice(0, 4), (counts.get(d.slice(0, 4)) || 0) + 1);
    const labels = [];
    for (let y = y0; y <= y1; y += 1) labels.push(String(y));
    return { values: labels.map((l) => counts.get(l) || 0), labels };
  }
  for (const d of sorted) counts.set(d.slice(0, 7), (counts.get(d.slice(0, 7)) || 0) + 1);
  const keys = [];
  for (let i = 0; i < months; i += 1) {
    const y = y0 + Math.floor((m0 - 1 + i) / 12);
    const m = ((m0 - 1 + i) % 12) + 1;
    keys.push(`${y}-${String(m).padStart(2, "0")}`);
  }
  return { values: keys.map((k) => counts.get(k) || 0), labels: keys.map(monthLabel) };
}

// How long ago a day was, in the unit that reads best.
function sinceDay(day) {
  if (!day) return "";
  const days = Math.round((Date.now() - new Date(`${day}T00:00:00`).getTime()) / 86400000);
  if (days < 1) return "hoy";
  if (days < 60) return `hace ${count(days, "día", "días")}`;
  if (days < 730) return `hace ${count(Math.round(days / 30.4), "mes", "meses")}`;
  return `hace ${fmt(days / 365.25, 1)} años`;
}

const CAPTURE_RESULTS = { capturado: ["Capturado", "ok"], sin_colibri: ["Sin colibrí", "warn"] };

// A date and a time, with the date even when it is today.
function whenLong(epoch) {
  if (epoch === null || epoch === undefined) return "—";
  const when = new Date(epoch * 1000);
  const time = when.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (when.toDateString() === new Date().toDateString()) return `Hoy, ${time}`;
  return `${when.toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" })}, ${time}`;
}

function epochIso(epoch) { return epoch === null || epoch === undefined ? null : new Date(epoch * 1000).toISOString(); }


function pickFilter(name, value) {
  ui.filters = { ...ui.filters, [name]: ui.filters[name] === value ? "" : value };
  render(true);
}

// The ten largest, the rest as one bar that does not filter.
function topBars(entries, label = (v) => v) {
  const sorted = entries.slice().sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  const items = sorted.slice(0, 10).map(([key, n]) => ({ key, label: label(key), value: n }));
  const rest = sorted.slice(10);
  if (rest.length) items.push({ label: `Otras ${rest.length}`, value: rest.reduce((sum, [, n]) => sum + n, 0) });
  return items;
}

// What the filtered birds look like, before anyone opens the list.
function subjectSummary(list, addTags) {
  const f = ui.filters;
  const byCapture = f.project || f.locality || f.from || f.to;
  const inScope = list.filter(wantedInScope).length;
  const toAdd = list.filter((b) => b.inUse.length && !wantedInScope(b)).length;
  const seen = list.filter((b) => b.times_seen > 0).length;
  const species = topBars(tally(list.map((b) => b.species || NO_SPECIES)), (v) => (v === NO_SPECIES ? "Sin especie" : v));
  const sexes = topBars(tally(list.map((b) => b.sex).filter(Boolean)), es);
  const ages = topBars(tally(list.map((b) => b.age).filter(Boolean)), es);
  // A bird counts once per place or project it was caught in, with any of its tags.
  const relevant = (b) => b.captures.filter((c) => !byCapture || captureMatches(c, f));
  const localities = topBars(tally(list.flatMap((b) => [...new Set(relevant(b).map((c) => c.locality).filter(Boolean))])));
  const projects = topBars(tally(list.flatMap((b) => [...new Set(relevant(b).map((c) => c.project).filter(Boolean))])));
  const months = byMonth(list.map((b) => b.capture_days.at(-1)).filter(Boolean));

  const traps = (data.overview?.traps || []).filter((t) => t.has_latch !== false);
  const adding = new Set(addTags);
  const all = data.specimens?.specimens || [];
  const ids = ui.scope === "all" ? traps.map((t) => t.node_id).concat(null) : [scopeId()];
  const limit = interestLimit();
  const occupancy = ids.map((id) => {
    const n = all.filter((s) => adding.has(s.tag) || (id === null ? s.all_traps : isOfInterest(s, id))).length;
    return { label: id === null ? "Trampa que se conecte después" : trapName(id), value: n, text: `${n} de ${limit}` };
  });

  const card = (title, body, note) => `<div class="card"><h2>${title}</h2>${body}${note ? `<p class="small muted" style="margin:8px 0 0">${note}</p>` : ""}</div>`;
  return `
    <div class="grid">
      ${stat("Coinciden", fmt(list.length, 0), "individuos")}
      ${stat(`De interés en ${scopeName()}`, fmt(inScope, 0))}
      ${stat("Se agregarían", fmt(toAdd, 0))}
      ${stat("Leídos por las trampas", fmt(seen, 0), list.length ? `${pct(seen / list.length, 0)} de los que coinciden` : "")}
    </div>
    <p class="small muted" style="margin:0">Clic en una barra para filtrar por ella; otro clic quita el filtro.</p>
    <div class="charts">
      ${card("Especie", hbars(species, { pick: "species", selected: f.species }))}
      ${card("Sexo y edad", hbars(sexes, { pick: "sex", selected: f.sex }) + '<div style="height:12px"></div>' + hbars(ages, { pick: "age", selected: f.age }))}
      ${card("Localidad", hbars(localities, { pick: "locality", selected: f.locality }), "Dónde fue capturado cada individuo (cuenta una vez por lugar).")}
      ${card("Proyecto", hbars(projects, { pick: "project", selected: f.project }))}
      ${card("Última captura", months.values.length ? columns(months.values, months.labels, { every: Math.max(1, Math.ceil(months.labels.length / 5)), titles: months.labels.map((l, i) => `${l}: ${count(months.values[i], "individuo", "individuos")}`) }) : '<p class="small muted" style="margin:0">Sin fechas.</p>', "Cuántos se vieron por última vez en la base del CICG en cada mes: los de la izquierda llevan más tiempo sin recapturarse.")}
      ${card("Cómo quedarían las trampas", occupancy.length ? hbars(occupancy, { max: limit, warnAbove: limit }) : '<p class="small muted" style="margin:0">Ninguna trampa conectada.</p>', toAdd ? `Si marcas los ${toAdd} en ${escapeHtml(scopeName())}.` : "Con lo que ya está marcado.")}
    </div>`;
}

function subjectRows(list) {
  const rows = list.slice(0, MAX_LISTED);
  const more = list.length > rows.length
    ? `<p class="small muted">Mostrando ${rows.length} de ${list.length}. Afina los filtros para ver el resto; los botones actúan sobre los ${list.length}.</p>`
    : "";
  if (!rows.length) return '<p class="muted">Ningún individuo coincide. Cambia los filtros o importa la base del CICG.</p>';
  return more + rows.map((b) => {
    const [interest, css] = birdInterest(b);
    const days = b.capture_days.slice(-3).reverse().map(dayLabel).join(", ") + (b.capture_days.length > 3 ? ` y ${b.capture_days.length - 3} más` : "");
    const last = b.captures.at(-1);
    const where = [last?.locality, last?.project].filter(Boolean).join(", ");
    const buttons = [];
    if (b.inUse.length && !wantedInScope(b)) buttons.push(`<button class="quiet" onclick="markOne('${b.key}')">Marcar</button>`);
    if (removableInScope(b)) buttons.push(`<button class="quiet" onclick="unmarkOne('${b.key}')">Quitar</button>`);
    const tags = b.rows.length > 1 ? ` <span class="chip">${b.rows.length} tags</span>` : "";
    return `<div class="row" style="border-top:1px solid var(--soft);padding:6px 0;flex-wrap:nowrap">
      <a href="${birdHref(b)}" style="flex:1 1 auto;min-width:0;color:inherit;text-decoration:none;padding:4px">
        <span class="strong">${escapeHtml(b.code || "Sin código")}</span> · <span class="strong italic">${escapeHtml(b.species || "Sin especie")}</span>${tags}
        <span class="mono small muted"> · ${b.inUse.length ? escapeHtml(b.inUse.map((s) => s.biomark).join(", ")) : "sin tag en uso"}${b.band_number ? ` · anillo ${escapeHtml(b.band_number)}` : ""}</span><br>
        <span class="small muted">${days ? `Capturado ${escapeHtml(days)}` : "Sin fecha en la lista"}${where ? ` (última: ${escapeHtml(where)})` : ""} · ${count(b.times_seen, "lectura", "lecturas")}</span><br>
        <span class="small strong ${css}">${escapeHtml(interest)}</span> ${syncChips(b)}
      </a>
      <div class="row" style="flex:0 0 auto">${buttons.join("")}</div></div>`;
  }).join("");
}

// One bird's page. The record comes from /api/specimens/{tag}/detail and is
// kept here, so a refresh repaints at once and only fetches again now and then.
const birdPages = new Map();
const BIRD_REFETCH_MS = 10000;

async function fetchBird(id) {
  const known = birdPages.get(id);
  if (known?.loading || (known && Date.now() - known.at < BIRD_REFETCH_MS)) return;
  birdPages.set(id, { ...(known || {}), loading: true, at: known?.at || 0 });
  let page = known?.page || null;
  let failed = false;
  try { page = await api(`/api/individuals/${encodeURIComponent(id)}/detail`); } catch (_) { failed = true; }
  const changed = JSON.stringify(page) !== JSON.stringify(known?.page);
  birdPages.set(id, { page, at: Date.now(), loading: false, failed: failed && !page });
  const r = route();
  if ((changed || (failed && !page)) && r.screen === "individuo" && decodeURIComponent(r.id || "") === id && !isEditing()) renderIndividuo(r.id);
}

function setThreshold(value) {
  const n = Number(value);
  if (!(n > 0)) return;
  ui.threshold = n;

  render(true);
}

function isOutlier(deviation) {
  return deviation !== null && deviation !== undefined && Math.abs(deviation) * 100 > ui.threshold;
}

function sparkline(values) {
  if (values.length < 2) return "";
  const w = 132, h = 30, pad = 4;
  const nums = values.map((v) => v.value);
  const lo = Math.min(...nums), span = (Math.max(...nums) - lo) || 1;
  const x = (i) => pad + (i * (w - 2 * pad)) / (values.length - 1);
  const y = (v) => h - pad - ((v - lo) / span) * (h - 2 * pad);
  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v.value).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Valores en cada captura"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"></polyline>${values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v.value).toFixed(1)}" r="${isOutlier(v.deviation) ? 3.5 : 2.2}" class="${isOutlier(v.deviation) ? "dot-warn" : "dot"}"><title>${escapeHtml(dayLabel(v.day))}: ${escapeHtml(fmt(v.value))}</title></circle>`).join("")}</svg>`;
}

function withUnit(value, unit) { return value === null || value === undefined ? "—" : `${fmt(value)}${unit ? ` ${unit}` : ""}`; }

function signed(value, unit) {
  if (value === null || value === undefined) return "—";
  const text = withUnit(Math.abs(value), unit);
  return value > 0 ? `+${text}` : value < 0 ? `−${text}` : text;
}

function measuresCard(page) {
  const measured = page.measures;
  const hasRecords = page.captures.some((c) => Object.keys(c.details || {}).length);
  const head = `<div class="section-head"><h2>Variación de medidas entre capturas</h2>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)">Resaltar a más de
      <input type="number" min="1" max="100" step="1" value="${escapeHtml(ui.threshold)}" style="width:84px" onchange="setThreshold(this.value)"> % de su mediana</label></div>`;
  if (!measured.length) {
    return `<div class="card">${head}<p class="muted" style="margin:8px 0 0">${hasRecords || !page.captures.length
      ? "Sin medidas en la base del CICG para este individuo."
      : "Las capturas no traen medidas todavía: vuelve a importar la base del CICG (Estación › Datos, o Individuos › Importar base del CICG) para traerlas."}</p></div>`;
  }
  const rows = measured.map((m) => {
    const flagged = m.values.filter((v) => isOutlier(v.deviation)).length;
    return `<tr class="${flagged ? "flagged" : ""}">
      <td><span class="strong">${escapeHtml(m.label)}</span>${flagged ? `<br><span class="small warn">${count(flagged, "valor alejado", "valores alejados")}</span>` : ""}</td>
      <td class="num">${m.count}</td>
      <td class="num">${withUnit(m.first, m.unit)}</td>
      <td class="num">${withUnit(m.last, m.unit)}</td>
      <td class="num">${m.count > 1 ? signed(m.change, m.unit) : "—"}</td>
      <td class="num">${m.count > 1 ? `${fmt(m.min)} a ${fmt(m.max)}` : "—"}</td>
      <td class="num">${withUnit(m.median, m.unit)}</td>
      <td class="num">${m.stdev === null ? "—" : `± ${fmt(m.stdev)}`}</td>
      <td class="num">${m.cv === null ? "—" : pct(m.cv)}</td>
      <td>${sparkline(m.values)}</td></tr>`;
  }).join("");
  return `<div class="card">${head}
    <div class="scroll" style="margin-top:8px"><table style="min-width:860px"><thead><tr>
      <th>Medida</th><th class="num">Veces</th><th class="num">Primera</th><th class="num">Última</th><th class="num">Cambio</th>
      <th class="num">Rango</th><th class="num">Mediana</th><th class="num">Desv. est.</th><th class="num">CV</th><th>En cada captura</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">CV: desviación estándar sobre la media. Un valor resaltado se aleja de la mediana del individuo más que el umbral: puede ser real (el peso cambia con la época, el ala con la muda) o un error de medición o de digitación.</p></div>`;
}

function captureRecord(page, capture, deviations) {
  const fields = page.fields;
  const details = capture.details || {};
  const groups = page.groups.map((g) => {
    const inGroup = fields.filter((f) => f.group === g.key && details[f.key] !== undefined);
    if (!inGroup.length) return "";
    if (g.key === "fotos") {
      return `<h3>${escapeHtml(g.label)}</h3><div class="small" style="grid-column:1 / -1">${escapeHtml(inGroup.map((f) => f.label).join(", "))}</div>`;
    }
    return `<h3>${escapeHtml(g.label)}</h3>` + inGroup.map((f) => {
      const value = details[f.key];
      const deviation = deviations[f.key]?.[capture.day];
      const shown = f.kind === "number" ? withUnit(value, f.unit) : String(value);
      const dev = deviation === undefined || deviation === null ? "" : ` <span class="small ${isOutlier(deviation) ? "warn strong" : "muted"}">(${deviation >= 0 ? "+" : "−"}${fmt(Math.abs(deviation) * 100, 1)} %)</span>`;
      return `<div class="line"><span class="muted">${escapeHtml(f.label)}</span><span>${escapeHtml(shown)}${dev}</span></div>`;
    }).join("");
  }).join("");
  return groups || '<p class="small muted" style="margin:4px 0">Sin más datos de esta captura en la base importada.</p>';
}

function capturesCard(page) {
  if (!page.captures.length) return '<div class="card"><h2>Capturas</h2><p class="muted" style="margin:0">Sin capturas en la lista importada.</p></div>';
  const deviations = {};
  for (const m of page.measures) {
    deviations[m.key] = {};
    for (const v of m.values) deviations[m.key][v.day] = v.deviation;
  }
  const severalTags = page.tags.length > 1;
  const items = page.captures.map((c, index) => ({ c, index })).reverse().map(({ c, index }) => {
    const key = `${c.day}|${c.tag}`;
    const open = ui.openCaptures.has(key);
    const d = c.details || {};
    const quick = [["weight", "g"], ["wing", "mm"]].filter(([k]) => d[k] !== undefined).map(([k, unit]) => `${k === "weight" ? "peso" : "ala"} ${withUnit(d[k], unit)}`);
    const flagged = Object.keys(deviations).filter((k) => isOutlier(deviations[k][c.day])).length;
    const title = index === 0 ? "Marcaje" : `Recaptura ${index}`;
    const where = [c.locality, c.project].filter(Boolean).join(" · ");
    return `<div style="margin-bottom:8px">
      <button class="capture-head ${open ? "open" : ""}" aria-expanded="${open}" onclick="toggleCapture('${escapeHtml(key)}')">
        <span><span class="strong">${title}</span> · ${escapeHtml(dayLabel(c.day))}${d.time_captured ? ` · ${escapeHtml(d.time_captured)}` : ""}<br>
          <span class="small muted">${escapeHtml(where || "Sin lugar")}${severalTags ? ` · tag ${escapeHtml(c.biomark)}` : ""}</span></span>
        <span class="small">${escapeHtml(quick.join(" · "))}${flagged ? ` <span class="chip warn">${count(flagged, "medida alejada", "medidas alejadas")}</span>` : ""}</span>
      </button>
      ${open ? `<div class="capture-body">${captureRecord(page, c, deviations)}</div>` : ""}</div>`;
  }).join("");
  return `<div class="card">
    <div class="section-head"><h2>${count(page.captures.length, "captura", "capturas")} en la base del CICG</h2>
      <div class="row"><button class="quiet" onclick="openAllCaptures(true)">Abrir todas</button><button class="quiet" onclick="openAllCaptures(false)">Cerrar todas</button></div></div>
    <p class="small muted" style="margin:4px 0 12px">Abre una captura para ver todas sus medidas, la muda, quién lo manipuló y la muestra.</p>
    ${items}</div>`;
}









function isEditing() {
  const el = document.activeElement;
  if (!el) return false;
  if (el.tagName === "INPUT") return !["checkbox", "file"].includes(el.type);
  return el.tagName === "SELECT" || el.tagName === "TEXTAREA";
}

// An operator's half-typed value must survive a refresh: while a field has
// focus, new data waits. Everything else repaints, including the banners.
// A capture rings a bell at the station until someone answers it, so whoever
// is nearby hears it without watching the screen. Browsers only allow sound
// after a click on the page, so the operator turns it on once; the choice is
// remembered on this computer.
const sound = { on: false, ctx: null, lastRing: 0, notified: new Set() };
try { sound.on = localStorage.getItem("captureSound") === "on"; } catch (_) { /* private window: off */ }
const RING_EVERY_MS = 6000;

function audioReady() {
  if (!sound.ctx) {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return false;
    sound.ctx = new Context();
  }
  if (sound.ctx.state === "suspended") sound.ctx.resume();
  return sound.ctx.state === "running";
}

// Two strikes, ding-dong, each a few inharmonic partials fading out like a bell.
function bell() {
  if (!audioReady()) return;
  const ctx = sound.ctx;
  const strike = (at, base) => {
    for (const [ratio, level] of [[1, 0.35], [2.76, 0.12], [5.4, 0.05]]) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = base * ratio;
      gain.gain.setValueAtTime(level, at);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 1.6);
      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + 1.7);
    }
  };
  strike(ctx.currentTime, 880);
  strike(ctx.currentTime + 0.45, 660);
}

function toggleCaptureSound() {
  sound.on = !sound.on;
  try { localStorage.setItem("captureSound", sound.on ? "on" : "off"); } catch (_) { /* not remembered */ }
  if (sound.on) {
    bell();
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  }
  render(true);
}

// The first click anywhere also unlocks the sound when it was left on.
document.addEventListener("pointerdown", () => { if (sound.on) audioReady(); }, { once: true });

function announceCaptures() {
  const pending = (data.overview?.traps || []).filter((t) => t.capture);
  document.title = pending.length ? `¡Captura! · Estación CICG` : "Estación CICG";
  if (!pending.length || !sound.on) return;
  if (Date.now() - sound.lastRing >= RING_EVERY_MS) {
    sound.lastRing = Date.now();
    bell();
  }
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  for (const t of pending) {
    const key = `${t.node_id}:${t.capture.at}`;
    if (sound.notified.has(key)) continue;
    sound.notified.add(key);
    const subject = subjectByTag(t.capture.tag);
    new Notification(`Captura en ${t.name}`, {
      body: subject?.registered ? `${subject.cicg_id ? `${subject.cicg_id} · ` : ""}${subject.species || "Sin especie"} · ${subject.biomark}` : "Lectura desconocida",
      requireInteraction: true,
    });
  }
}

// The control every screen needs at hand: whether the traps may capture.
// Deactivating is the safe side and happens at once; activating asks first.
function trapSwitch() {
  const o = data.overview;
  if (!o) return "";
  const latched = (o.traps || []).filter(canCapture);
  if (o.paused) {
    const done = latched.filter(confirmedPaused).length;
    return `<div class="ts-state"><span class="dot dot-warn"></span>Trampas desactivadas</div>
      <div class="ts-note">${latched.length ? `${done} de ${latched.length} ${latched.length === 1 ? "suelta" : "sueltas"}` : "Ninguna conectada"}</div>
      <button class="primary" onclick="confirmResume()">Activar todas</button>`;
  }
  return `<div class="ts-state"><span class="dot dot-ok"></span>Trampas activas</div>
    <button class="danger-outline" onclick="pauseTraps()">Desactivar todas</button>`;
}

function navStatus() {
  const traps = data.overview?.traps || [];
  const online = traps.filter((t) => t.reachable).length;
  const link = data.health?.link;
  const gateway = !link ? ["Gateway: sin datos", "dot-off"] : link.connected ? ["Gateway conectada", "dot-ok"] : ["Gateway desconectada", "dot-warn"];
  const soundNote = sound.on && sound.ctx?.state !== "running" ? '<div class="ts-note">Haz clic en la página para oírlo.</div>' : "";
  return `<div class="indicator"><span class="dot ${gateway[1]}"></span>${gateway[0]}</div>
    <div class="indicator"><span class="dot ${online ? "dot-ok" : "dot-off"}"></span>${online} de ${count(traps.length, "trampa", "trampas")} en línea</div>
    <button class="switch" role="switch" aria-checked="${sound.on}" onclick="toggleCaptureSound()"><span class="switch-track"><span class="switch-thumb"></span></span>Sonido de captura</button>${soundNote}`;
}

function render(force) {
  renderBanners();
  announceCaptures();
  const r = route();
  document.querySelectorAll("nav a[data-nav]").forEach((a) => {
    const name = a.dataset.nav;
    const on = name === r.screen || (r.screen === "trampa" && name === "inicio")
      || (r.screen === "individuo" && name === "individuos");
    a.classList.toggle("on", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $("trap-switch").innerHTML = trapSwitch();
  $("nav-status").innerHTML = navStatus();
  $("nav-version").textContent = data.update?.current || data.station?.version || "";
  if (!force && isEditing()) return;
  if (r.screen === "trampa") renderTrampa(r.id, r.tab);
  else if (r.screen === "individuos") renderIndividuos();
  else if (r.screen === "individuo") renderIndividuo(r.id);
  else if (r.screen === "visitas") renderVisitas();
  else if (r.screen === "capturas") renderCapturas();
  else if (r.screen === "bitacora") renderBitacora();
  else if (r.screen === "estacion") renderEstacion();
  else renderInicio();
}

async function refresh(force) {
  const onStation = route().screen === "estacion";
  const [overview, health, specimens, gateway, update, station] = await Promise.all([
    fetch("/api/overview").then((r) => r.json()).catch(() => data.overview),
    fetch("/health").then((r) => r.json()).catch(() => data.health),
    fetch("/api/specimens").then((r) => r.json()).catch(() => data.specimens),
    onStation ? fetch("/api/gateway").then((r) => r.json()).catch(() => data.gateway) : data.gateway,
    fetch("/api/update").then((r) => r.json()).catch(() => data.update),
    onStation || !data.station ? fetch("/api/station").then((r) => r.json()).catch(() => data.station) : data.station,
  ]);
  Object.assign(data, { overview, health, specimens, gateway, update, station });
  render(force === true);
}

// --- Estación: this station's own settings and data -------------------------
// Only what is set once in a while or read rarely. Arming, marking and
// deactivating the traps are the day's work and stay where they happen.

function gatewaySection() {
  const g = data.gateway;
  if (!g) return '<p class="muted" style="margin:0">Cargando…</p>';
  if (!g.enabled) return '<p style="margin:0">La estación arrancó sin gateway (--no-gateway).</p>';
  const state = g.connected
    ? `<span class="ok strong">Conectada</span> en <span class="mono">${escapeHtml(g.device)}</span>`
    : `<span class="warn strong">Sin conexión</span>${g.last_error ? `: ${escapeHtml(g.last_error)}` : ""}`;
  const listed = g.ports.some((p) => p.device === g.configured);
  const option = (value, label) => `<option value="${escapeHtml(value)}" ${g.configured === value ? "selected" : ""}>${escapeHtml(label)}</option>`;
  const options = [option("auto", "Automático (el único puerto USB)")]
    .concat(g.ports.map((p) => option(p.device, `${p.device}${p.description ? ` · ${p.description}` : ""}${p.usb ? "" : " (no es USB)"}`)))
    .concat(g.configured && g.configured !== "auto" && !listed ? [option(g.configured, `${g.configured} (no está conectado)`)] : []);
  return `<div>${state}</div>
    <div class="row" style="align-items:flex-end">
      <label style="flex:1 1 280px">Puerto de la gateway<select id="gateway-port">${options.join("")}</select></label>
      <button onclick="chooseGatewayPort()">Usar este puerto</button></div>
    <p class="small muted" style="margin:0">Se prueba de inmediato y la estación lo recuerda la próxima vez que la abras. "Automático" sirve cuando la gateway es lo único conectado por USB; con varias placas conectadas, elige el puerto.</p>`;
}

function soundSection() {
  const permission = "Notification" in window ? Notification.permission : "unsupported";
  const notes = {
    granted: ["Permitidas: una captura también avisa en el sistema.", ""],
    denied: ["Bloqueadas en este navegador. Se permiten desde la configuración del sitio.", "warn"],
    default: ["Todavía no se han permitido.", "muted"],
    unsupported: ["Este navegador no las tiene.", "muted"],
  }[permission];
  return `<button class="switch switch-light" role="switch" aria-checked="${sound.on}" onclick="toggleCaptureSound()"><span class="switch-track"><span class="switch-thumb"></span></span>Sonido de captura en este computador</button>
    <div class="row"><button onclick="bell()" ${sound.on ? "" : "disabled"}>Probar sonido</button>
      ${permission === "default" ? '<button onclick="askNotifications()">Permitir notificaciones</button>' : ""}</div>
    <p class="small ${notes[1]}" style="margin:0">Notificaciones del sistema: ${notes[0]}</p>
    <p class="small muted" style="margin:0">La campana suena cada 6 s mientras una captura espera respuesta. Se recuerda en este computador.</p>`;
}

async function askNotifications() {
  if ("Notification" in window) await Notification.requestPermission();
  render(true);
}

function dataSection() {
  const st = data.station;
  const last = st?.last_import;
  const lastText = last
    ? `${whenLong(last.epoch)} · ${last.filename}${last.sheet ? ` (hoja "${last.sheet}")` : ""} · ${count(last.individuals, "individuo", "individuos")}, ${count(last.tags, "tag", "tags")}${last.warnings ? ` · ${count(last.warnings, "aviso", "avisos")}` : ""}`
    : "Todavía no se ha importado.";
  return `<div class="line"><span class="muted">Base del CICG</span><span>${escapeHtml(lastText)}</span></div>
    <div class="line"><span class="muted">Datos de la estación</span><span class="mono small">${escapeHtml(st?.db_path || "—")}</span></div>
    <div class="row">${importButton("Importar base del CICG")}
      <a class="button" href="/api/export/reads.csv">Exportar lecturas</a>
      <a class="button" href="/api/export/visits.csv">Exportar visitas</a>
      <button onclick="makeBackup()">Hacer respaldo completo</button></div>
    <p class="small muted" style="margin:0">El respaldo copia toda la base de la estación, con un CSV y un README, en <span class="mono">${escapeHtml(st?.backup_folder || "respaldos")}</span>. Cópialo a una memoria USB o a la nube.</p>`;
}

async function makeBackup() {
  toast("Haciendo el respaldo…");
  await act("/api/backup", { method: "POST" }, (result) => `Respaldo listo en ${result.folder}`);
}

function clockSection() {
  const trust = data.station?.clock_trust || data.health?.clock_trust;
  const windows = data.station?.windows;
  const states = {
    ntp: ["Confirmado por internet", "ok", "La estación le pasa esta hora a las trampas."],
    rtc: ["Confirmado por el reloj de respaldo", "ok", "La estación le pasa esta hora a las trampas."],
    unset: ["Sin confirmar", "warn", windows
      ? "Conecta el computador a internet y activa Configuración › Hora e idioma › Establecer la hora automáticamente. Mientras tanto la estación no le pasa la hora a las trampas."
      : "Conecta el computador a internet y activa la hora automática (Configuración › Fecha y hora, o `timedatectl set-ntp true`). Mientras tanto la estación no le pasa la hora a las trampas."],
  };
  const [label, css, note] = states[trust] || ["Sin datos", "muted", ""];
  return `<div class="line"><span class="muted">Reloj de este computador</span><span class="strong ${css}">${label}</span></div>
    <p class="small muted" style="margin:0">${escapeHtml(note)}</p>`;
}

function versionSection() {
  const u = data.update;
  const st = data.station;
  const version = u?.current || st?.version || "—";
  if (!st?.updates) {
    return `<div class="line"><span class="muted">Versión</span><span class="strong">${escapeHtml(version)}</span></div>
      <p class="small muted" style="margin:0">Esta copia corre desde el código: se actualiza con git, no desde aquí.</p>`;
  }
  let state = "Al día.";
  if (u?.state && u.state !== "idle") state = u.message || u.state;
  else if (u?.available) state = `Hay una versión nueva: ${u.latest}.`;
  return `<div class="line"><span class="muted">Versión</span><span class="strong">${escapeHtml(version)}</span></div>
    <p style="margin:0">${escapeHtml(state)}</p>
    <div class="row">
      ${u?.available ? (u.action === "install" ? '<button class="primary" onclick="runUpdate()">Actualizar</button>' : `<a class="button" href="${escapeHtml(u.url)}">Descargar la nueva</a>`) : ""}
      <button onclick="checkUpdates()">Buscar actualizaciones</button>
      ${u?.notes_url ? `<a href="${escapeHtml(u.notes_url)}" target="_blank" rel="noopener">Novedades</a>` : ""}</div>`;
}

async function checkUpdates() {
  toast("Buscando actualizaciones…");
  try { data.update = await api("/api/update/check", { method: "POST" }); } catch (error) { toast(error.message, { error: true }); return; }
  setTimeout(async () => {
    await refresh(true);
    toast(data.update?.available ? `Hay una versión nueva: ${data.update.latest}.` : "No hay una versión nueva.");
  }, 2500);
}

function measuresSection() {
  return `<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)">Resaltar medidas a más de
      <input type="number" min="1" max="100" step="1" value="${escapeHtml(ui.threshold)}" style="width:84px" onchange="setThreshold(this.value)"> % de la mediana del individuo</label>
    <p class="small muted" style="margin:0">Vale para la página de cada individuo y se recuerda en este computador. También se cambia desde allí.</p>`;
}

function renderEstacion() {
  const section = (id, title, body) => `<section class="card stack" id="${id}" style="gap:12px"><h2 style="margin:0">${title}</h2>${body}</section>`;
  $("screen").innerHTML = `
    <h1>Estación</h1>
    <div class="stack narrow">
      ${section("gateway", "Gateway", gatewaySection())}
      ${section("avisos", "Aviso de captura", soundSection())}
      ${section("datos", "Datos", dataSection())}
      ${section("reloj", "Reloj", clockSection())}
      ${section("version", "Versión", versionSection())}
      ${section("medidas", "Medidas", measuresSection())}
    </div>`;
}

async function chooseGatewayPort() {
  const device = $("gateway-port").value;
  document.activeElement?.blur();
  await act("/api/gateway", jsonBody("PUT", { device }), device === "auto" ? "Gateway en automático." : `Gateway en ${device}.`);
}

window.addEventListener("hashchange", () => {
  ui.showBirdVisits = false;
  ui.editBird = false;
  const r = route();
  if (r.screen === "gateway") { location.hash = "#/estacion"; return; }
  if (r.screen === "estacion") refresh(true); else render(true);
});




new EventSource("/api/events").onmessage = () => refresh();
refresh(true);
setInterval(refresh, 5000);
</script>
</html>
