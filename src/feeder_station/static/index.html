<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación CICG</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; margin: 0; padding: 0 .75rem 2rem;
    background: #111; color: #eee; font-size: 16px; max-width: 100vw; overflow-x: hidden;
  }
  header { position: sticky; top: 0; z-index: 10; background: #111; padding-top: .5rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: .5rem 0; }

  .banner { border-radius: 8px; padding: .75rem; margin: .5rem 0; font-size: .95rem; }
  .banner-clock { background: #402a00; border: 1px solid #a86a00; color: #ffcf7a; }
  .banner-capture { background: #3a0d0d; border: 2px solid #c93a3a; padding: 1rem; }
  .banner-capture strong { font-size: 1.05rem; }
  .banner-capture button {
    font: inherit; min-height: 44px; min-width: 44px; padding: .6rem 1.1rem; border-radius: 6px;
    border: 1px solid #c93a3a; background: #c93a3a; color: #fff; font-weight: 600; margin-top: .5rem;
  }

  .trap { border: 1px solid #333; border-radius: 8px; padding: .75rem; margin: .5rem 0; }
  .trap.no-contact { border-color: #a86a00; }
  .state { font-weight: 700; text-transform: uppercase; font-size: .8rem; letter-spacing: .05em; }
  .no-contact-badge { color: #ffb648; font-weight: 700; margin: .3rem 0; }
  /* WARNING 2 (verify-report-batch2c.md): bold, same weight as
     .no-contact-badge, not the previous small italic -- doubt about a
     trap's own state must read at a glance next to "SIN CONTACTO", not
     as a footnote nobody notices. */
  .stale-badge { color: #ffcf7a; font-weight: 700; margin: .3rem 0; }
  .pending { color: #7ec8ff; font-size: .85rem; }
  .muted { color: #999; font-size: .85rem; }
  .empty { color: #999; }

  .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
  button {
    font: inherit; min-height: 44px; padding: .6rem 1rem; border-radius: 6px;
    border: 1px solid #555; background: #222; color: #eee;
  }

  details { margin-top: .6rem; }
  summary { cursor: pointer; padding: .5rem 0; min-height: 44px; display: flex; align-items: center; }
  textarea {
    width: 100%; min-height: 6rem; font: inherit; font-size: 16px; background: #1a1a1a;
    color: #eee; border: 1px solid #444; border-radius: 6px; padding: .5rem; margin-top: .4rem;
  }
  .field-error { color: #ff8a8a; font-size: .85rem; margin-top: .3rem; }
  .field-ok { color: #7ee787; font-size: .85rem; margin-top: .3rem; }
</style>
<header>
  <h1>Estación CICG</h1>
  <div id="clock-banner"></div>
  <div id="link-banner"></div>
  <div id="capture-banner"></div>
</header>
<div id="traps">Cargando…</div>
<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function refresh() {
  const [traps, health] = await Promise.all([
    fetch("/api/traps").then((r) => r.json()),
    fetch("/health").then((r) => r.json()).catch(() => null),
  ]);
  renderClockBanner(health);
  renderLinkBanner(health);
  renderCaptureBanner(traps);
  renderTraps(traps);
}

// S12: an unset clock is a banner, not a footnote -- every timestamp on this
// page is suspect until this clears, so it renders above everything else,
// pinned, for as long as /health says `unset`.
function renderClockBanner(health) {
  $("clock-banner").innerHTML = (health && health.clock_trust === "unset")
    ? '<div class="banner banner-clock">⚠ Reloj de la estación sin confirmar. ' +
      "Las horas en esta pantalla pueden ser incorrectas.</div>"
    : "";
}

// CRITICAL 5 (sdd-verify, field-station-p4): the station's own radio link
// going down must be visible here, not inferred from every trap quietly
// turning unreachable one by one -- design.md section 4, "the gateway
// never pretends the link is up." `null` when no gateway is configured at
// all, which is not a fault.
function renderLinkBanner(health) {
  const link = health && health.link;
  $("link-banner").innerHTML = (link && link.connected === false)
    ? '<div class="banner banner-clock">⚠ Enlace de radio de la estación caído.' +
      (link.last_error ? ` (${escapeHtml(link.last_error)})` : "") +
      "</div>"
    : "";
}

// S3: an unacknowledged capture is the loudest thing on the page, pinned in
// the header so it stays visible while scrolling the trap list below, and
// offering exactly one action.
function renderCaptureBanner(traps) {
  const captured = traps.filter((t) => t.capture);
  $("capture-banner").innerHTML = captured.map((t) => `
    <div class="banner banner-capture">
      <strong>Trampa ${t.node_id} capturó una marca</strong><br>
      Marca ${escapeHtml(t.capture.tag)}<br>
      <small>${escapeHtml(t.capture.at)}</small><br>
      <button onclick="ack(${t.node_id})">Atendida</button>
    </div>`).join("");
}

function renderTraps(traps) {
  $("traps").innerHTML = traps.length
    ? traps.map(renderTrap).join("")
    : '<p class="empty">Ninguna trampa se ha reportado todavía.</p>';
}

// S4/S11: `reachable` is a fact separate from `state` -- a trap we cannot
// reach is never shown as simply "armed"; the two facts stay visually
// distinct here rather than merged into one reassuring line.
function renderTrap(t) {
  const noContact = !t.reachable;
  const battery = t.battery_mv != null ? `${t.battery_mv} mV` : "sin dato";
  const version = t.targets_version != null ? t.targets_version : "—";
  const lastSeen = t.last_seen ? escapeHtml(t.last_seen) : "nunca";
  // WARNING J (sdd-verify field-station-p4): `state` is `null` exactly
  // when this station has no readable report to show -- never render
  // that as the English enum values around it would suggest by omission;
  // say so, in Spanish, same as every other "no data" label on this page.
  const state = t.state != null ? t.state : "desconocido";
  // WARNING 2 (sdd-verify field-station-p4 batch 2 close-out): a stale-
  // flagged trap must not render byte-identical to a confident one --
  // independent of `reachable` (`no-contact-badge` above), which after a
  // restart comes from whichever row won the state race and can stay
  // `true` even while that row's own freshness is in doubt.
  // Record correction (Batch 2e, verify-report-batch2d.md Q7): this
  // comment used to say "rendered as doubt (italic)", but `.stale-badge`
  // has been `font-weight: 700` -- the same bold weight as
  // `.no-contact-badge`, no italic -- since the very commit that added
  // this comment. The CSS is what an operator needs: doubt about a
  // trap's own state must read at a glance next to "SIN CONTACTO", not as
  // a footnote nobody notices at a smaller, lighter weight. The comment
  // was wrong, not the rule; this trap is still not silent, its
  // last-known word just might not be its newest one.
  // 13.11/13.12: what the trap is actually hunting -- the station's own
  // desired list, not only its version number.
  const targets = (t.targets && t.targets.length)
    ? t.targets.map(escapeHtml).join(", ")
    : "ninguno";
  return `
    <div class="trap ${noContact ? "no-contact" : ""}">
      <div class="state">Trampa ${t.node_id} · ${state}</div>
      ${noContact ? '<p class="no-contact-badge">⚠ SIN CONTACTO — este estado puede estar desactualizado</p>' : ""}
      ${t.state_may_be_stale ? '<p class="stale-badge">⚠ puede no ser el último reporte de esta trampa</p>' : ""}
      <p class="muted">Batería: ${battery} · Lista de objetivos: v${version} · Últ. contacto: ${lastSeen}</p>
      <p class="muted">Objetivos actuales: ${targets}</p>
      ${t.pending_command ? `<p class="pending">${describePending(t)}</p>` : ""}
      <div class="actions">
        <button onclick="disarm(${t.node_id})">Desarmar</button>
        ${t.pending_command ? `<button onclick="cancelCommand(${t.node_id})">Cancelar comando pendiente</button>` : ""}
      </div>
      <details>
        <summary>Editar lista de objetivos</summary>
        <textarea id="targets-${t.node_id}"
          placeholder="Un código de 14 caracteres por línea, ej: 0384199C87EC06"></textarea>
        <div class="actions">
          <button onclick="saveTargets(${t.node_id})">Guardar lista</button>
        </div>
        <div id="targets-msg-${t.node_id}"></div>
      </details>
    </div>`;
}

// docs/pending.md, "Remove the remote arm affordance": there is no
// "Armar" button any more (arming needs a person at the trap, not a
// downlink), but `pending_command === "arm"` is still a real state this
// page can be handed -- a station that boots against a database from
// before this change rehydrates a pre-existing ARM command
// (`adapters/store.py`'s own rehydration, kept for exactly that reason).
// Rendering it correctly here, rather than deleting the branch, is what
// "leave nothing that renders a state the operator can no longer reach"
// means in practice: the operator cannot have *caused* this pending
// "arm", but they can still read it, and cancel it below.
function describePending(t) {
  if (t.pending_command === "set_targets") {
    return `Lista de objetivos v${t.desired_targets_version} pendiente de confirmar`;
  }
  const verb = t.pending_command === "arm" ? "Armado" : "Desarmado";
  return `${verb} pendiente de confirmar`;
}

async function disarm(id) { await fetch(`/api/traps/${id}/disarm`, { method: "POST" }); refresh(); }
async function ack(id) { await fetch(`/api/traps/${id}/acknowledge`, { method: "POST" }); refresh(); }
async function cancelCommand(id) { await fetch(`/api/traps/${id}/cancel`, { method: "POST" }); refresh(); }

async function saveTargets(id) {
  const box = $(`targets-${id}`);
  const msg = $(`targets-msg-${id}`);
  const tags = box.value.split("\n").map((s) => s.trim()).filter((s) => s.length > 0);
  const response = await fetch(`/api/traps/${id}/targets`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tags }),
  });
  if (response.ok) {
    msg.innerHTML = '<p class="field-ok">Guardada. Esperando confirmación de la trampa.</p>';
    refresh();
  } else {
    msg.innerHTML = '<p class="field-error">No se pudo guardar: revisá que cada código tenga ' +
      "14 caracteres hexadecimales, uno por línea.</p>";
  }
}

new EventSource("/api/events").onmessage = refresh;
refresh();
setInterval(refresh, 30000);
</script>
</html>
