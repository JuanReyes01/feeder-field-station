<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación CICG</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: light;
    --ground: #F3F5F1; --surface: #FFFFFF; --ink: #17211D; --muted: #56635C; --line: #D8DED8;
    --soft: #EDF0ED; --accent: #0A6657; --accent-soft: #DDEEEA; --accent-ink: #084F44;
    --warn: #B4460B; --warn-soft: #FBE9DD; --warn-ink: #7E2F05; --info: #1F5FA8;
    --info-soft: #E3ECF7; --info-ink: #143F70;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); font-size: 15px; line-height: 1.45;
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout { display: flex; flex-wrap: wrap; min-height: 100vh; align-items: stretch; }
  nav {
    flex: 1 1 200px; background: var(--ink); color: #fff; padding: 20px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  nav .brand { font-size: 18px; font-weight: 600; padding: 0 10px 14px; }
  nav a {
    display: block; min-height: 44px; padding: 10px; border-radius: 6px; color: #fff;
    text-decoration: none; font-weight: 500;
  }
  nav a.on { background: #fff; color: var(--ink); }
  nav .status a { display: inline; min-height: 0; padding: 0; color: inherit; text-decoration: underline; font-weight: 400; }
  nav .status {
    margin-top: 16px; padding: 12px 10px; border-top: 1px solid #3D4A43; font-size: 13px;
    color: #E4EAE6;
  }
  main {
    flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .ok { color: var(--accent); }
  .warn { color: var(--warn); }
  .info { color: var(--info); }
  .italic { font-style: italic; }
  .strong { font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .stack > *, .grid-wide > * { min-width: 0; }
  .narrow { max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .grid-wide { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .stat .value { font-size: 28px; font-weight: 600; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; white-space: nowrap; }
  td { padding: 10px 8px; border-top: 1px solid var(--soft); vertical-align: middle; }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center; font: inherit;
    min-height: 44px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none;
  }
  button:hover, .button:hover { filter: brightness(.95); }
  button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 600; }
  button.quiet { background: transparent; border-color: #8A968F; min-height: 40px; }
  button.selected { background: var(--ink); color: #fff; }
  button.big { flex: 1 1 130px; min-height: 48px; font-size: 16px; }
  .toggle {
    width: 100%; justify-content: space-between; gap: 12px; text-align: left; min-height: 48px;
    border-color: #8A968F; margin-bottom: 8px;
  }
  .toggle.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .banner {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px; border-radius: 6px;
  }
  .banner .title { font-size: 18px; font-weight: 600; }
  .banner-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .banner-info { background: var(--info-soft); color: var(--info-ink); }
  .banner-ok { background: var(--accent-soft); color: var(--accent-ink); }
  .state { font-size: 34px; font-weight: 600; line-height: 1.2; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--soft); }
  .line > :last-child { text-align: right; font-weight: 500; }
  .event { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 0; border-top: 1px solid var(--soft); }
  .event .time { flex: 0 0 74px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .event .kind { flex: 0 0 84px; font-size: 13px; font-weight: 600; }
  .event .text { flex: 1 1 240px; }
  .step { display: flex; flex-direction: column; gap: 8px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea {
    min-height: 44px; padding: 8px 12px; border: 1px solid #8A968F; border-radius: 6px;
    font: inherit; font-size: 16px; background: var(--surface); color: var(--ink);
  }
  textarea { resize: vertical; font-family: var(--mono); font-size: 15px; }
  /* A long option must not widen its field past the row. */
  .row > label { min-width: 0; }
  label > select, label > input:not([type=checkbox]) { width: 100%; min-width: 0; }
  input[type=checkbox] { width: 24px; height: 24px; min-height: 0; }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; background: var(--soft); color: var(--muted); }
  .chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.info { background: var(--info-soft); color: var(--info-ink); }
  .chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .check { flex-direction: row; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
  code { font-family: var(--mono); font-size: 13px; background: var(--soft); padding: 2px 6px; border-radius: 4px; }
  .hidden-file { position: absolute; left: -9999px; }
</style>
<div class="layout">
  <nav aria-label="Secciones">
    <div class="brand">Estación CICG</div>
    <a href="#/inicio" data-nav="inicio">Inicio</a>
    <a href="#/individuos" data-nav="individuos">Individuos</a>
    <a href="#/visitas" data-nav="visitas">Visitas</a>
    <a href="#/capturas" data-nav="capturas">Capturas</a>
    <a href="#/bitacora" data-nav="bitacora">Bitácora</a>
    <div class="status" id="nav-status">Cargando…</div>
  </nav>
  <main>
    <div id="banners" class="stack"></div>
    <div id="screen" class="stack">Cargando…</div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

const STATE_ES = { idle: "Suelta", armed: "Armada", fired: "Disparada", fault: "Con fallo" };
const KIND_ES = {
  reads: ["Lectura", "muted"], captures: ["Captura", "warn"], commands: ["Comando", "ok"],
  faults: ["Fallo", "warn"], connections: ["Conexión", "info"],
};
const FILTERS = [
  ["all", "Todo"], ["captures", "Capturas"], ["commands", "Comandos"], ["faults", "Fallos"],
  ["connections", "Conexiones"], ["reads", "Lecturas"],
];
const PERIODS = [["1", "Hoy"], ["7", "Últimos 7 días"], ["36500", "Todo"]];
const TRAP_TABS = {
  prep: "Preparar", control: "Control", config: "Configuración", list: "Lista de interés",
  visits: "Visitas", log: "Bitácora",
};

const data = { overview: null, health: null, specimens: null, gateway: null, update: null };
const ui = {
  filter: "all", period: "1", visitTrap: "", trapSearch: "", message: "", updateHidden: false,
  filters: { species: "", project: "", locality: "", sex: "", age: "", from: "", to: "", text: "", status: "" }, scope: "all", entries: "",
};

// The real list has more than a thousand individuals: a screen shows what
// matters and search reaches the rest.
const MAX_LISTED = 100;
const MAX_SEARCH_RESULTS = 20;

function matchesSearch(s, text) {
  const q = text.trim().toLowerCase();
  return !q || [s.biomark, s.tag, s.species, s.band_number, s.cicg_id].some((v) => (v || "").toLowerCase().includes(q));
}

// Lists load after the page paints. Showing the last answer for the same list
// right away keeps a 5 s refresh from flickering through "Cargando…", and the
// newest request wins, so a slow answer can't paint over another screen.
const lastHtml = new Map();
const newestLoad = new Map();

async function loadInto(targetId, url, toHtml) {
  const key = `${targetId}:${url}`;
  const target = $(targetId);
  if (target && lastHtml.has(key)) {
    target.classList.remove("muted");
    target.innerHTML = lastHtml.get(key);
  }
  newestLoad.set(targetId, key);
  let html;
  try { html = toHtml(await api(url)); } catch (_) { return; }
  lastHtml.set(key, html);
  const current = $(targetId);
  if (!current || newestLoad.get(targetId) !== key) return;
  current.classList.remove("muted");
  current.innerHTML = html;
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return { screen: parts[0] || "inicio", id: parts[1], tab: parts[2] };
}

function clockTime(epoch) {
  if (epoch === null || epoch === undefined) return "—";
  return new Date(epoch * 1000).toLocaleTimeString("es-CO", { hour12: false });
}

function dateTime(epoch) {
  const when = new Date(epoch * 1000);
  const sameDay = when.toDateString() === new Date().toDateString();
  return sameDay ? clockTime(epoch) : `${when.toLocaleDateString("es-CO")} ${clockTime(epoch)}`;
}

function ago(iso) {
  if (!iso) return "Nunca";
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - new Date(iso).getTime() / 1000));
  if (seconds < 60) return `Hace ${seconds} s`;
  if (seconds < 3600) return `Hace ${Math.round(seconds / 60)} min`;
  if (seconds < 86400) return `Hace ${Math.round(seconds / 3600)} h`;
  return `Hace ${Math.round(seconds / 86400)} d`;
}

function duration(seconds) {
  if (seconds < 60) return `${Math.round(seconds)} s`;
  return `${Math.floor(seconds / 60)} min ${Math.round(seconds % 60)} s`;
}

function trapById(id) {
  return (data.overview?.traps || []).find((t) => String(t.node_id) === String(id));
}

function trapCode(id) { return Number(id).toString(16).toUpperCase().padStart(4, "0"); }

function trapName(id) { return trapById(id)?.name || `Trampa ${trapCode(id)}`; }

function isPrepared(t) { return t.setup_done; }

function stateLabel(t) {
  if (t.has_latch === false) return "Solo lector";
  if (!t.state) return "Sin reporte";
  return STATE_ES[t.state] || t.state;
}

function stateClass(t) {
  if (t.state === "fired" || t.state === "fault" || !t.reachable) return "warn";
  return t.state === "armed" ? "ok" : "";
}

function clockNote(t) {
  if (!t.clock_epoch || t.clock_source === 0) return ["Sin hora", "warn"];
  const offset = Math.round(t.clock_offset_s ?? 0);
  if (Math.abs(offset) <= 5) return ["Sincronizada", "ok"];
  return [`${offset > 0 ? "Adelantada" : "Atrasada"} ${Math.abs(offset)} s`, "warn"];
}

function listNote(t) {
  if (t.pending_command === "set_targets") {
    return t.reachable ? ["Enviando a la trampa…", "info"] : ["Sin conexión; la recibe al conectarse", "warn"];
  }
  if (t.targets_match === true) return ["Confirmada por la trampa", "ok"];
  if (t.targets_match === false) return ["Distinta en la trampa; se corrige sola", "warn"];
  return ["Sin confirmar todavía", "muted"];
}

function count(n, one, many) { return `${n} ${n === 1 ? one : many}`; }

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = "No se pudo completar.";
    try {
      const body = await response.json();
      if (typeof body.detail === "string") detail = body.detail;
    } catch (_) { /* a body that is not JSON keeps the generic message */ }
    throw new Error(detail);
  }
  return response.json();
}

async function act(path, options) {
  try {
    const result = await api(path, options);
    ui.message = "";
    await refresh(true);
    return result;
  } catch (error) {
    ui.message = error.message;
    render(true);
    return null;
  }
}

const jsonBody = (method, body) => ({
  method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
});

function arm(id) { return act(`/api/traps/${id}/arm`, { method: "POST" }); }
function pauseTraps() { return act("/api/traps/pause", { method: "POST" }); }
function resumeTraps() { return act("/api/traps/resume", { method: "POST" }); }
function canCapture(t) { return t.has_latch !== false; }
// Released and nothing left to send: the trap itself says it is deactivated.
function confirmedPaused(t) { return t.state === "idle" && !t.pending_command; }
function disarm(id) { return act(`/api/traps/${id}/disarm`, { method: "POST" }); }
function testFire(id) { return act(`/api/traps/${id}/test-fire`, { method: "POST" }); }
async function finishPrep(id) {
  await act(`/api/traps/${id}/profile`, jsonBody("PATCH", { setup_done: true }));
  location.hash = `#/trampa/${id}/control`;
}
function cancelCommand(id) { return act(`/api/traps/${id}/cancel`, { method: "POST" }); }
function ack(id, result) { return act(`/api/traps/${id}/acknowledge?result=${result}`, { method: "POST" }); }

async function setLatch(id, hasLatch) {
  const profile = hasLatch ? { has_latch: true } : { has_latch: false, setup_done: true };
  await act(`/api/traps/${id}/profile`, jsonBody("PATCH", profile));
  if (!hasLatch) location.hash = `#/trampa/${id}/visits`;
}

async function saveTrapName(id) {
  await act(`/api/traps/${id}/profile`, jsonBody("PATCH", { name: $("trap-name").value.trim() || null }));
  document.activeElement?.blur();
}

function subjectByTag(tag) { return (data.specimens?.specimens || []).find((s) => s.tag === tag); }

function isOfInterest(subject, nodeId) {
  return subject.all_traps || subject.trap_ids.includes(Number(nodeId));
}

function toggleInterest(tag, nodeId) {
  const subject = subjectByTag(tag);
  const known = (data.overview?.traps || []).map((t) => t.node_id);
  let ids = subject.all_traps ? known : subject.trap_ids.slice();
  const id = Number(nodeId);
  ids = ids.includes(id) ? ids.filter((n) => n !== id) : ids.concat(id);
  return act(`/api/specimens/${tag}/interest`, jsonBody("PUT", { all_traps: false, node_ids: ids }));
}

function toggleInterestEverywhere(tag) {
  const subject = subjectByTag(tag);
  return act(`/api/specimens/${tag}/interest`, jsonBody("PUT", { all_traps: !subject.all_traps, node_ids: [] }));
}

function registerUnknown(tag) {
  return act(`/api/specimens/${tag}`, jsonBody("PATCH", { registered: true }));
}

async function addSubject(event) {
  event.preventDefault();
  const form = event.target;
  const value = (name) => form.elements[name].value.trim() || null;
  const created = await act("/api/specimens", jsonBody("POST", {
    pit: value("pit") || "", species: value("species"), band_number: value("band_number"),
    of_interest: form.elements.of_interest.checked,
  }));
  if (created) form.reset();
}

async function saveSubject(event, tag) {
  event.preventDefault();
  const form = event.target;
  const value = (name) => form.elements[name].value.trim() || null;
  const saved = await act(`/api/specimens/${tag}`, jsonBody("PATCH", {
    species: value("species"), species_code: value("species_code"), sex: value("sex"),
    age: value("age"), band_number: value("band_number"), cicg_id: value("cicg_id"), registered: true,
  }));
  if (saved) { ui.message = "Guardado."; document.activeElement?.blur(); render(true); }
}

async function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  ui.message = `Importando ${file.name}…`;
  render(true);
  const result = await act(`/api/specimens/import?filename=${encodeURIComponent(file.name)}`, {
    method: "POST", body: file,
  });
  input.value = "";
  if (!result) return;
  const parts = [`${result.sheet ? `Hoja "${result.sheet}": ` : ""}${result.created} nuevos, ${result.updated} actualizados, ${result.dated} con fecha de captura.`];
  if (result.replaced) parts.push(`${count(result.replaced, "tag reemplazado", "tags reemplazados")} (el colibrí ya lleva otro).`);
  if (result.without_tag) parts.push(`${count(result.without_tag, "fila sin PIT se omitió", "filas sin PIT se omitieron")}: sin tag no hay lectura.`);
  if (result.error_count) parts.push(`${count(result.error_count, "fila", "filas")} sin importar: ${result.errors.slice(0, 3).join(" ")}`);
  if (result.warning_count) parts.push(`${count(result.warning_count, "aviso", "avisos")}: ${result.warnings.slice(0, 3).join(" ")}`);
  ui.message = parts.join(" ");
  render(true);
}

function setFilter(value) { ui.filter = value; render(true); }
function setPeriod(value) { ui.period = value; document.activeElement?.blur(); render(true); }
function setVisitTrap(value) { ui.visitTrap = value; document.activeElement?.blur(); render(true); }

function updateBanner() {
  const u = data.update;
  if (!u?.enabled) return "";
  const notes = u.notes_url ? `<a class="button quiet" href="${escapeHtml(u.notes_url)}" target="_blank" rel="noopener">Novedades</a>` : "";
  if (u.state && u.state !== "idle") {
    const css = u.state === "error" ? "banner-warn" : "banner-info";
    return `<div class="banner ${css}"><div><div class="title">Actualización</div>${escapeHtml(u.message || "")}</div>${u.state === "error" ? notes : ""}</div>`;
  }
  if (!u.available || ui.updateHidden) return "";
  const action = u.action === "install"
    ? '<button class="primary" onclick="runUpdate()">Actualizar</button>'
    : `<a class="button primary" href="${escapeHtml(u.url)}">Descargar</a>`;
  const how = u.action === "install"
    ? "Se descarga e instala sola; tus datos se quedan."
    : "Es la versión portable: baja el archivo nuevo y úsalo en lugar de este. Tus datos se quedan.";
  return `<div class="banner banner-info"><div><div class="title">Hay una versión nueva de la estación (${escapeHtml(u.latest)})</div>Tienes la ${escapeHtml(u.current)}. ${how}</div>
    <div class="row">${action}${notes}<button class="quiet" onclick="ui.updateHidden = true; render(true)">Ahora no</button></div></div>`;
}

async function runUpdate() {
  await act("/api/update", { method: "POST" });
}

function renderBanners() {
  const traps = data.overview?.traps || [];
  const parts = [];
  const update = updateBanner();
  if (update) parts.push(update);
  if (data.health?.clock_trust === "unset") {
    parts.push('<div class="banner banner-warn"><div><div class="title">Reloj de la estación sin confirmar</div>Las horas en esta pantalla pueden ser incorrectas.</div></div>');
  }
  if (data.overview?.paused) {
    const latched = traps.filter(canCapture);
    const done = latched.filter(confirmedPaused).length;
    const detail = latched.length
      ? `${done} de ${latched.length} ya ${latched.length === 1 ? "confirmó" : "confirmaron"} que ${latched.length === 1 ? "está suelta" : "están sueltas"}.`
      : "Ninguna trampa conectada.";
    parts.push(`<div class="banner banner-warn"><div><div class="title">Trampas desactivadas: no van a capturar</div>${detail} Una que se conecte ahora también se desactiva.</div>
      <button class="primary" onclick="resumeTraps()">Activar todas</button></div>`);
  }
  const link = data.health?.link;
  if (link && link.connected === false) {
    parts.push(`<div class="banner banner-warn"><div><div class="title">Enlace de radio caído</div>La gateway no responde.${link.last_error ? ` (${escapeHtml(link.last_error)})` : ""}</div>${route().screen === "gateway" ? "" : '<a class="button" href="#/gateway">Elegir puerto</a>'}</div>`);
  }
  for (const t of traps.filter((x) => x.capture)) {
    const subject = subjectByTag(t.capture.tag);
    const label = subject?.registered ? (subject.species || "Sin especie") : "Lectura desconocida";
    parts.push(`<div class="banner banner-warn">
      <div><div class="title">${escapeHtml(t.name)} se soltó</div>
      <span class="italic">${escapeHtml(label)}</span> · <span class="mono">${escapeHtml(subject?.biomark || t.capture.tag)}</span>. Revisa la red y di qué encontraste.</div>
      <div class="row">
        <button class="danger" onclick="ack(${t.node_id}, 'capturado')">Capturado</button>
        <button onclick="ack(${t.node_id}, 'sin_colibri')">Sin colibrí</button>
        ${sound.on ? "" : '<button class="quiet" onclick="toggleCaptureSound()">Activar sonido</button>'}
      </div></div>`);
  }
  for (const t of traps.filter((x) => !isPrepared(x) && x.has_latch === null)) {
    parts.push(`<div class="banner banner-info">
      <div><div class="title">${escapeHtml(t.name)} se conectó sola</div>Ya está registrando visitas. Falta prepararla para capturar.</div>
      <a class="button primary" href="#/trampa/${t.node_id}/prep">Preparar ${escapeHtml(t.name)}</a></div>`);
  }
  if (ui.message) {
    parts.push(`<div class="banner banner-info"><div>${escapeHtml(ui.message)}</div><button class="quiet" onclick="ui.message=''; render(true)">Cerrar</button></div>`);
  }
  $("banners").innerHTML = parts.join("");
}

function renderInicio() {
  const o = data.overview;
  const traps = o?.traps || [];
  const online = traps.filter((t) => t.reachable).length;
  const stats = [
    ["Visitas hoy", o?.visits_today ?? 0], ["Individuos hoy", o?.subjects_today ?? 0],
    ["Capturas hoy", o?.captures_today ?? 0], ["Trampas en línea", online],
  ];
  const rows = traps.map((t) => {
    const [clock, clockClass] = clockNote(t);
    const [list, listClass] = listNote(t);
    const wanted = t.wanted?.length ?? 0;
    return `<tr>
      <td class="strong">${escapeHtml(t.name)}</td>
      <td class="strong ${isPrepared(t) ? stateClass(t) : "info"}">${isPrepared(t) ? escapeHtml(stateLabel(t)) : "Falta preparar"}</td>
      <td class="${t.reachable ? "" : "warn strong"}">${t.reachable ? "" : "Sin señal · "}${escapeHtml(ago(t.last_seen))}</td>
      <td><span class="mono">${clockTime(t.clock_epoch)}</span><br><span class="${clockClass}">${clock}</span></td>
      <td>${t.has_latch === false ? "No aplica" : `${count(wanted, "sujeto", "sujetos")}<br><span class="${listClass}">${list}</span>`}</td>
      <td>${t.visits_today ?? 0}</td>
      <td><a class="button" href="#/trampa/${t.node_id}">Abrir</a></td>
    </tr>`;
  }).join("");
  $("screen").innerHTML = `
    <div class="row between"><h1>Inicio</h1>
      ${o?.paused ? "" : '<button onclick="pauseTraps()">Desactivar todas las trampas</button>'}</div>
    <div class="grid">${stats.map(([label, value]) => `<div class="stat"><div class="small muted">${label}</div><div class="value">${value}</div></div>`).join("")}</div>
    <div class="card scroll"><h2>Trampas</h2>
      ${traps.length
        ? `<table style="min-width:820px"><thead><tr><th>Trampa</th><th>Estado</th><th>Última señal</th><th>Hora en la trampa</th><th>Lista de interés</th><th>Visitas hoy</th><th><span class="hidden-file">Acción</span></th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p class="muted">Prende una trampa: aparece aquí sola.</p>'}
    </div>
    <div class="card"><div class="row between"><h2>Últimos eventos</h2><a class="button" href="#/bitacora">Ver bitácora</a></div><div id="log-rows" class="muted">Cargando…</div></div>`;
  loadLog({ limit: 6, kind: "all" });
}

function loadLog({ limit, kind, nodeId }) {
  const query = new URLSearchParams({ limit, kind });
  if (nodeId !== undefined) query.set("node_id", nodeId);
  return loadInto("log-rows", `/api/log?${query}`, ({ events }) => (events.length ? events.map((e) => {
    const [label, css] = KIND_ES[e.kind] || [e.kind, "muted"];
    return `<div class="event"><span class="time">${escapeHtml(dateTime(e.epoch))}</span><span class="kind ${css}">${label}</span><span class="text">${escapeHtml(e.text)}</span>${nodeId === undefined ? `<span class="small muted">${escapeHtml(trapName(e.node_id))}</span>` : ""}</div>`;
  }).join("") : '<p class="muted">Todavía no hay eventos.</p>'));
}

function trapTabs(t) {
  const tabs = [];
  if (!isPrepared(t)) tabs.push("prep");
  if (t.has_latch !== false) tabs.push("control");
  tabs.push("config");
  if (t.has_latch !== false) tabs.push("list");
  tabs.push("visits", "log");
  return tabs;
}

function renderTrampa(id, requestedTab) {
  const t = trapById(id);
  if (!t) {
    $("screen").innerHTML = `<h1>Trampa ${escapeHtml(trapCode(id))}</h1><div class="card muted">Esta trampa no se ha conectado.</div>`;
    return;
  }
  const tabs = trapTabs(t);
  const tab = tabs.includes(requestedTab) ? requestedTab : tabs[0];
  const tabButtons = tabs.map((name) => `<a class="button ${name === tab ? "selected-link" : ""}" style="${name === tab ? "background:var(--ink);color:#fff" : ""}" href="#/trampa/${t.node_id}/${name}">${TRAP_TABS[name]}</a>`).join("");
  const body = {
    prep: renderPrep, control: renderControl, config: renderConfig, list: renderList,
    visits: renderTrapVisits, log: renderTrapLog,
  }[tab](t);
  $("screen").innerHTML = `
    <div><a class="button" style="min-height:40px;border-color:#8A968F" href="#/inicio">Volver a inicio</a></div>
    <div class="row between" style="align-items:flex-end">
      <div><h1>${escapeHtml(t.name)}</h1>
      <div class="small muted">${escapeHtml(stateLabel(t))} · Última señal: ${escapeHtml(ago(t.last_seen).toLowerCase())} · ${t.has_latch === null ? "Sin definir" : t.has_latch ? "Con pestillo" : "Solo lector"}</div></div>
      <div class="row">${tabButtons}</div>
    </div>
    ${body}`;
  if (tab === "visits") loadVisits({ nodeId: t.node_id, days: 1 });
  if (tab === "log") loadLog({ limit: 100, kind: "all", nodeId: t.node_id });
  if (tab === "control") loadLog({ limit: 6, kind: "commands", nodeId: t.node_id });
}

function subjectToggles(t) {
  return `<label>Buscar individuo para agregar<input value="${escapeHtml(ui.trapSearch)}" oninput="setTrapSearch(this.value, ${t.node_id})" placeholder="biomark, especie o anillo"></label>
    <div id="trap-subject-rows" style="margin-top:12px">${trapSubjectRows(t)}</div>`;
}

function subjectButton(s, t) {
  const on = isOfInterest(s, t.node_id);
  return `<button class="toggle ${on ? "on" : ""}" onclick="toggleInterest('${s.tag}', ${t.node_id})">
    <span><span class="italic">${escapeHtml(s.species || "Sin especie")}</span> · <span class="mono small">${escapeHtml(s.biomark)}</span></span>
    <span>${on ? (s.all_traps ? "De interés en todas" : "De interés") : "No"}</span></button>`;
}

function trapSubjectRows(t) {
  const subjects = (data.specimens?.specimens || []).filter((s) => s.registered);
  if (!subjects.length) return '<p class="muted">Todavía no hay individuos. <a href="#/individuos">Importa el Excel</a>.</p>';
  const marked = subjects.filter((s) => isOfInterest(s, t.node_id));
  const others = ui.trapSearch.trim()
    ? subjects.filter((s) => !isOfInterest(s, t.node_id) && matchesSearch(s, ui.trapSearch))
    : [];
  const shown = others.slice(0, MAX_SEARCH_RESULTS);
  return [
    marked.length ? marked.map((s) => subjectButton(s, t)).join("") : '<p class="muted">Ningún individuo marcado en esta trampa.</p>',
    shown.map((s) => subjectButton(s, t)).join(""),
    others.length > shown.length ? `<p class="small muted">Mostrando ${shown.length} de ${others.length}. Afina la búsqueda.</p>` : "",
  ].join("");
}

function setTrapSearch(value, nodeId) {
  ui.trapSearch = value;
  const t = trapById(nodeId);
  if (t && $("trap-subject-rows")) $("trap-subject-rows").innerHTML = trapSubjectRows(t);
}

function renderPrep(t) {
  const [clock, clockClass] = clockNote(t);
  const latch = t.has_latch === true;
  return `<div class="stack narrow">
    <div class="card step"><div class="strong">1. Conexión y hora</div>
      <div class="ok">Conectada sola al prenderla.</div>
      <div>Hora en la trampa: <span class="mono">${clockTime(t.clock_epoch)}</span> · <span class="${clockClass}">${clock}</span></div></div>
    <div class="card step"><div class="strong">2. ¿Tiene pestillo?</div>
      <div class="row">
        <button class="big ${latch ? "selected" : ""}" onclick="setLatch(${t.node_id}, true)">Con pestillo</button>
        <button class="big" onclick="setLatch(${t.node_id}, false)">Solo lector</button>
      </div></div>
    ${latch ? `
    <div class="card step"><div class="strong">3. Calibrar el pestillo</div>
      <p style="margin:0">Por ahora se hace por USB, una vez por trampa, y al cambiar el servo:</p>
      <code>pio run -e calibrate -t upload -t monitor</code>
      <p class="small muted" style="margin:0">Los ángulos quedan guardados en la trampa. Si no está calibrada, rechaza armar y el fallo sale en la bitácora.</p></div>
    <div class="card step"><div class="strong">4. Escoger a quién capturar</div><div>${subjectToggles(t)}</div></div>
    <div class="card step"><div class="strong">5. Armado</div>
      <div>La trampa se arma sola. Estado ahora: <span class="strong ${stateClass(t)}">${escapeHtml(stateLabel(t))}</span></div>
      ${t.state === "armed" ? "" : `<p class="small muted" style="margin:0">Si no llega a "Armada" en unos segundos, revisa la bitácora.</p><div><button onclick="arm(${t.node_id})">Armar</button></div>`}
      <div><button class="primary" onclick="finishPrep(${t.node_id})">Terminar preparación</button></div></div>` : ""}
  </div>`;
}

function renderControl(t) {
  const pending = t.test_fire_pending
    ? "Disparo de prueba"
    : { arm: "Armar", disarm: "Desarmar", set_targets: "Enviar lista" }[t.pending_command];
  const armed = t.state === "armed";
  return `<div class="grid-wide">
    <div class="card stack">
      <div><div class="small strong muted">Estado confirmado por la trampa</div>
        <div class="state ${stateClass(t)}">${escapeHtml(stateLabel(t))}</div>
        ${t.reachable ? "" : `<div class="warn strong">Sin señal: este es su último reporte.</div>`}
        ${t.state_may_be_stale ? '<div class="warn strong">Puede no ser su último reporte.</div>' : ""}
      </div>
      <div class="row">
        ${data.overview?.paused
          ? '<p class="warn strong" style="margin:0">Todas las trampas están desactivadas. Actívalas desde Inicio.</p>'
          : armed
            ? `<button class="big" onclick="testFire(${t.node_id})">Disparar (prueba)</button>
             <button class="big" onclick="disarm(${t.node_id})">Desarmar para mantenimiento</button>`
            : `<button class="primary big" onclick="arm(${t.node_id})">Armar</button>`}
      </div>
      ${t.pending_command || t.test_fire_pending ? `<div class="banner banner-info"><div>${pending}: esperando confirmación de la trampa…</div><button onclick="cancelCommand(${t.node_id})">Cancelar</button></div>` : ""}
      <p class="small muted" style="margin:0">La trampa se arma sola al prenderla y 5 s después de cada disparo. Se suelta cuando llega un sujeto de su lista; el mismo tag no la vuelve a disparar hasta que respondas la captura (o 10 min). "Armada" confirma que el servo se movió, no que el aro esté puesto. "Armar" solo aparece si quedó desarmada.</p>
    </div>
    <div class="card"><h2>Últimos comandos</h2><div id="log-rows" class="muted">Cargando…</div></div>
  </div>`;
}

function renderConfig(t) {
  const [clock, clockClass] = clockNote(t);
  const [list, listClass] = listNote(t);
  const lines = [
    ["Tipo", t.has_latch === null ? "Sin definir" : t.has_latch ? "Con pestillo" : "Solo lector", ""],
    ["Identificador", `${t.code} (sale de su MAC)`, ""],
    ["Última señal", ago(t.last_seen), t.reachable ? "" : "warn"],
    ["Hora en la trampa", clockTime(t.clock_epoch), ""],
    ["Estado de la hora", clock, clockClass],
    ["Lista de interés", `Versión ${t.targets_version ?? "—"}, ${count(t.reported?.length ?? 0, "tag", "tags")}`, ""],
    ["Estado de la lista", list, listClass],
    ["Calibración del pestillo", "Guardada en la trampa, por USB", ""],
    ["Batería", t.battery_mv ? `${t.battery_mv} mV` : "Sin lectura en esta versión", ""],
  ];
  return `<div class="card narrow">
    <form onsubmit="event.preventDefault(); saveTrapName(${t.node_id})" class="row" style="align-items:flex-end;margin-bottom:12px">
      <label style="flex:1 1 240px">Lugar (opcional)<input id="trap-name" value="${escapeHtml(t.place || "")}" placeholder="Comedero del jardín"></label>
      <button>Guardar</button>
    </form>
    ${lines.map(([k, v, css]) => `<div class="line"><span class="muted">${k}</span><span class="${css}">${escapeHtml(v)}</span></div>`).join("")}
  </div>`;
}

function renderList(t) {
  const [list] = listNote(t);
  const css = t.targets_match === true && t.pending_command !== "set_targets" ? "banner-ok"
    : t.targets_match === false ? "banner-warn" : "banner-info";
  const reported = t.reported === null || t.reported === undefined
    ? '<p class="muted">La trampa todavía no ha reportado su lista.</p>'
    : t.reported.length
      ? t.reported.map((r) => `<div class="line"><span class="mono small">${escapeHtml(r.biomark)}</span><span class="${r.known ? "italic" : "warn"}">${escapeHtml(r.label)}</span></div>`).join("")
      : '<p class="muted">La lista de la trampa está vacía.</p>';
  return `<div class="card stack narrow">
    <div class="banner ${css}"><div class="strong">${list}</div></div>
    <div><h2>Sujetos de interés para esta trampa</h2>${subjectToggles(t)}</div>
    <div><h2>Lista que tiene la trampa ahora</h2>${reported}</div>
  </div>`;
}

function renderTrapVisits() {
  return `<div class="card scroll" id="visit-rows"><p class="muted">Cargando…</p></div>`;
}

function renderTrapLog() {
  return `<div class="card" id="log-rows"><p class="muted">Cargando…</p></div>`;
}

function loadVisits({ nodeId, tag, days }) {
  const query = new URLSearchParams({ days });
  if (nodeId !== undefined && nodeId !== "") query.set("node_id", nodeId);
  if (tag) query.set("tag", tag);
  return loadInto("visit-rows", `/api/visits?${query}`, ({ visits }) => (visits.length ? `<table style="min-width:680px"><thead><tr><th>Inicio</th><th>Trampa</th><th>Especie</th><th>Biomark</th><th>Duración</th><th>Lecturas</th><th>Hora</th></tr></thead><tbody>
    ${visits.map((v) => `<tr>
      <td class="mono">${escapeHtml(dateTime(v.start_epoch))}</td>
      <td>${escapeHtml(trapName(v.node_id))}</td>
      <td class="${v.known ? "italic" : "warn"}">${escapeHtml(v.label)}</td>
      <td class="mono">${escapeHtml(v.biomark)}</td>
      <td>${v.open ? '<span class="ok strong">En curso</span>' : escapeHtml(duration(v.duration_s))}</td>
      <td>${v.reads}</td>
      <td class="${v.clock_trusted ? "" : "warn"}">${v.clock_trusted ? "Confiable" : "Dudosa"}</td>
    </tr>`).join("")}</tbody></table>` : '<p class="muted">Sin visitas en este periodo.</p>'));
}

function subjectInterest(s) {
  if (s.all_traps) return ["De interés en todas", "ok"];
  if (s.trap_ids.length) return [`De interés en ${s.trap_ids.map(trapName).join(" y ")}`, "ok"];
  return ["Sin marcar", "muted"];
}

// Individuos: the CICG's list filtered down to who to mark. The buttons act on
// exactly what the filters show, in the traps the "Dónde" selector names.
const NO_FILTERS = { species: "", project: "", locality: "", sex: "", age: "", from: "", to: "", text: "", status: "" };
const NO_SPECIES = "__none__";

function interestLimit() { return data.specimens?.of_interest_limit ?? 81; }

function scopeId() { return ui.scope === "all" ? null : Number(ui.scope); }

function scopeName() { return ui.scope === "all" ? "todas las trampas" : trapName(ui.scope); }

// Wanted where the selector points: every trap, or that one.
function wantedInScope(s) {
  return ui.scope === "all" ? s.all_traps : isOfInterest(s, ui.scope);
}

// What "Quitar" would change: in "todas", any interest at all.
function removableInScope(s) {
  return ui.scope === "all" ? (s.all_traps || s.trap_ids.length > 0) : isOfInterest(s, ui.scope);
}

function dayLabel(day) {
  return new Date(`${day}T00:00:00`).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
}

function registeredSubjects() { return (data.specimens?.specimens || []).filter((s) => s.registered); }

function isMarked(s) { return s.all_traps || s.trap_ids.length > 0; }

// Project, locality and dates must hold for one same capture: "captured in
// Zona alta in 2026" is one capture, not one of each.
function captureMatches(c, f) {
  return (!f.project || c.project === f.project) && (!f.locality || c.locality === f.locality)
    && (!f.from || c.day >= f.from) && (!f.to || c.day <= f.to);
}

// "Todos" means the tags birds wear now: a lost tag only shows when asked for,
// or when it is still marked, so it can be removed.
const STATUS_TEST = {
  "": (s) => !s.replaced,
  marked: isMarked,
  unmarked: (s) => !s.replaced && !isMarked(s),
  replaced: (s) => s.replaced,
};

function filteredSubjects() {
  const f = ui.filters;
  const byCapture = f.project || f.locality || f.from || f.to;
  return registeredSubjects().filter((s) => (!f.species || (f.species === NO_SPECIES ? !s.species : s.species === f.species))
    && (!f.sex || s.sex === f.sex) && (!f.age || s.age === f.age)
    && (!byCapture || s.captures.some((c) => captureMatches(c, f)))
    && STATUS_TEST[f.status || ""](s)
    && matchesSearch(s, f.text))
    .sort((a, b) => (b.capture_days.at(-1) || "").localeCompare(a.capture_days.at(-1) || "") || a.biomark.localeCompare(b.biomark));
}

// The fullest list after marking these, mirroring the station's own check:
// each known trap, plus a trap that connects later when marking in all.
function fullestAfterAdding(subjects) {
  const adding = new Set(subjects.map((s) => s.tag));
  const all = data.specimens?.specimens || [];
  const ids = ui.scope === "all" ? (data.overview?.traps || []).map((t) => t.node_id).concat(null) : [scopeId()];
  return ids.map((id) => ({
    id,
    count: all.filter((s) => adding.has(s.tag) || (id === null ? s.all_traps : isOfInterest(s, id))).length,
  })).sort((a, b) => b.count - a.count)[0];
}

// Where a subject stands in each trap: what the trap itself reported, not what
// the station asked for.
function syncChips(s) {
  const traps = data.overview?.traps || [];
  const chips = [];
  for (const t of traps) {
    const wanted = isOfInterest(s, t.node_id);
    const has = (t.reported || []).some((r) => r.tag === s.tag);
    if (wanted && has) chips.push([`En ${t.name}`, "ok"]);
    else if (wanted) chips.push(t.reachable ? [`Enviando a ${t.name}…`, "info"] : [`${t.name}: lo recibe al conectarse`, "warn"]);
    else if (has) chips.push(t.reachable ? [`Saliendo de ${t.name}…`, "info"] : [`${t.name}: lo quita al conectarse`, "warn"]);
  }
  if (s.all_traps && !traps.length) chips.push(["Todas las trampas, al conectarse", ""]);
  return chips.map(([text, css]) => `<span class="chip ${css}">${escapeHtml(text)}</span>`).join(" ");
}

function changeSummary(result, action) {
  const n = result.changed;
  const verb = action === "add" ? (n === 1 ? "Marcado" : "Marcados") : (n === 1 ? "Quitado" : "Quitados");
  const parts = [n ? `${verb} ${n} en ${scopeName()}.` : "Nada cambió."];
  if (result.unchanged) parts.push(`${result.unchanged} ya ${result.unchanged === 1 ? "estaba" : "estaban"} así.`);
  if (result.created.length) parts.push(`Registrados como nuevos: ${result.created.join(", ")}.`);
  if (result.missing.length) parts.push(`No encontrados: ${result.missing.join(", ")}.`);
  if (result.ambiguous.length) parts.push(`Anillo de varios individuos, usa el biomark: ${result.ambiguous.join(", ")}.`);
  return parts.join(" ");
}

async function changeInterest(action, body) {
  const result = await act("/api/specimens/interest/change", jsonBody("POST", { action, node_id: scopeId(), ...body }));
  if (!result) return null;
  ui.message = changeSummary(result, action);
  render(true);
  return result;
}

function markOne(tag) { return changeInterest("add", { tags: [tag] }); }
function unmarkOne(tag) { return changeInterest("remove", { tags: [tag] }); }

function markFiltered(action) {
  const subjects = filteredSubjects().filter((s) => (action === "add" ? !wantedInScope(s) : removableInScope(s)));
  if (!subjects.length) return null;
  return changeInterest(action, { tags: subjects.map((s) => s.tag) });
}

async function markEntries(action) {
  const entries = ui.entries.split(/[\s,;]+/).filter(Boolean);
  if (!entries.length) { ui.message = "Escribe o pega al menos un biomark o anillo."; render(true); return; }
  const result = await changeInterest(action, { entries });
  if (result && !result.missing.length && !result.ambiguous.length) ui.entries = "";
  render(true);
}

function setScope(value) { ui.scope = value; document.activeElement?.blur(); render(true); }
function setFilterValue(name, value) {
  ui.filters = { ...ui.filters, [name]: value };
  if (name === "text") renderFilterResults(); else { document.activeElement?.blur(); render(true); }
}
function clearFilters() { ui.filters = { ...NO_FILTERS }; render(true); }

function listStatusRows() {
  const traps = data.overview?.traps || [];
  const everywhere = registeredSubjects().filter((s) => s.all_traps).length;
  const head = `<p class="small muted" style="margin:0 0 8px">${count(everywhere, "individuo marcado", "individuos marcados")} en todas las trampas, incluidas las que se conecten después. Cada trampa admite ${interestLimit()}.</p>`;
  if (!traps.length) return `${head}<p class="muted">Ninguna trampa conectada todavía.</p>`;
  return head + traps.map((t) => {
    if (t.has_latch === false) return `<div class="line"><span class="strong">${escapeHtml(t.name)}</span><span class="muted">Solo lector</span></div>`;
    const [list, css] = t.reachable ? listNote(t) : ["Sin conexión; la recibe al conectarse", "warn"];
    return `<div class="line"><span><span class="strong">${escapeHtml(t.name)}</span> · ${t.wanted?.length ?? 0} de ${interestLimit()}</span><span class="${css}">${escapeHtml(list)}</span></div>`;
  }).join("");
}

function filterOptions(values, selected, anyLabel, label) {
  return [`<option value="">${anyLabel}</option>`].concat(values.map(([value, n]) => `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(label(value))} (${n})</option>`)).join("");
}

function tally(values) {
  const counts = new Map();
  for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
  return [...counts];
}

function renderFilterResults() {
  const actions = $("filter-actions");
  const target = $("subject-results");
  if (!actions || !target) return;
  const subjects = filteredSubjects();
  const toAdd = subjects.filter((s) => !wantedInScope(s));
  const toRemove = subjects.filter(removableInScope);
  const fullest = toAdd.length ? fullestAfterAdding(toAdd) : null;
  const over = fullest && fullest.count > interestLimit();
  const where = fullest && (fullest.id === null ? "una trampa nueva" : trapName(fullest.id));
  actions.innerHTML = `
    <div class="strong">${count(subjects.length, "individuo coincide", "individuos coinciden")}</div>
    <div class="row">
      <button class="primary" ${toAdd.length && !over ? "" : "disabled"} onclick="markFiltered('add')">${toAdd.length || !subjects.length ? `Marcar ${toAdd.length} en ${escapeHtml(scopeName())}` : "Ya están todos marcados"}</button>
      <button ${toRemove.length ? "" : "disabled"} onclick="markFiltered('remove')">Quitar ${toRemove.length} de ${escapeHtml(scopeName())}</button>
      <button class="quiet" onclick="clearFilters()">Limpiar filtros</button>
    </div>
    ${over ? `<p class="warn small" style="margin:0">Así ${escapeHtml(where)} quedaría con ${fullest.count} de ${interestLimit()}. Afina los filtros o marca en una sola trampa.</p>` : ""}`;
  const rows = subjects.slice(0, MAX_LISTED);
  const more = subjects.length > rows.length
    ? `<p class="small muted">Mostrando ${rows.length} de ${subjects.length}. Afina los filtros para ver el resto; los botones actúan sobre los ${subjects.length}.</p>`
    : "";
  target.innerHTML = rows.length ? more + rows.map((s) => {
    const [interest, css] = subjectInterest(s);
    const days = s.capture_days.slice(-3).reverse().map(dayLabel).join(", ") + (s.capture_days.length > 3 ? ` y ${s.capture_days.length - 3} más` : "");
    const last = s.captures.at(-1);
    const where = [last?.locality, last?.project].filter(Boolean).join(", ");
    const buttons = [];
    if (!wantedInScope(s)) buttons.push(`<button class="quiet" onclick="markOne('${s.tag}')">Marcar</button>`);
    if (removableInScope(s)) buttons.push(`<button class="quiet" onclick="unmarkOne('${s.tag}')">Quitar</button>`);
    return `<div class="row" style="border-top:1px solid var(--soft);padding:6px 0;flex-wrap:nowrap">
      <a href="#/individuo/${s.tag}" style="flex:1 1 auto;min-width:0;color:inherit;text-decoration:none;padding:4px">
        ${s.cicg_id ? `<span class="strong">${escapeHtml(s.cicg_id)}</span> · ` : ""}<span class="strong italic">${escapeHtml(s.species || "Sin especie")}</span>
        <span class="mono small muted"> · ${escapeHtml(s.biomark)}${s.band_number ? ` · anillo ${escapeHtml(s.band_number)}` : ""}</span><br>
        <span class="small muted">${days ? `Capturado ${escapeHtml(days)}` : "Sin fecha en la lista"}${where ? ` (última: ${escapeHtml(where)})` : ""} · ${count(s.times_seen, "lectura", "lecturas")}</span><br>
        ${s.replaced ? '<span class="chip warn">Tag reemplazado: el colibrí ya no lo lleva</span> ' : ""}<span class="small strong ${css}">${escapeHtml(interest)}</span> ${syncChips(s)}
      </a>
      <div class="row" style="flex:0 0 auto">${buttons.join("")}</div></div>`;
  }).join("") : '<p class="muted">Ningún individuo coincide. Cambia los filtros o importa la lista del CICG.</p>';
}

function renderIndividuos() {
  const all = data.specimens?.specimens || [];
  const unknown = all.filter((s) => !s.registered);
  const registered = registeredSubjects();
  const f = ui.filters;
  const traps = data.overview?.traps || [];
  if (ui.scope !== "all" && !trapById(ui.scope)) ui.scope = "all";
  const scopes = [["all", "Todas las trampas"]].concat(traps.filter((t) => t.has_latch !== false).map((t) => [String(t.node_id), t.name]));
  const species = tally(registered.map((s) => s.species || NO_SPECIES)).sort((a, b) => (a[0] === NO_SPECIES) - (b[0] === NO_SPECIES) || a[0].localeCompare(b[0]));
  const captures = registered.flatMap((s) => s.captures);
  const byName = (a, b) => a[0].localeCompare(b[0]);
  const projects = tally(captures.map((c) => c.project).filter(Boolean)).sort(byName);
  const localities = tally(captures.map((c) => c.locality).filter(Boolean)).sort(byName);
  const sexes = tally(registered.map((s) => s.sex).filter(Boolean)).sort(byName);
  const ages = tally(registered.map((s) => s.age).filter(Boolean)).sort(byName);
  const days = captures.map((c) => c.day).sort();
  const replaced = registered.filter((s) => s.replaced).length;
  const pick = (name, label, values, any, show = (v) => v) => `<label style="flex:1 1 170px">${label}<select ${values.length ? "" : "disabled"} onchange="setFilterValue('${name}', this.value)">${filterOptions(values, f[name], any, show)}</select></label>`;
  const day = (name, label) => `<label style="flex:1 1 150px">${label}<input type="date" value="${escapeHtml(f[name])}" min="${days[0] || ""}" max="${days.at(-1) || ""}" ${days.length ? "" : "disabled"} onchange="setFilterValue('${name}', this.value)"></label>`;
  $("screen").innerHTML = `
    <div class="row between">
      <h1>Individuos</h1>
      <div class="row">
        <label class="button" style="color:var(--ink);flex-direction:row;font-size:15px">Importar lista del CICG<input class="hidden-file" type="file" accept=".xlsx,.xlsm,.csv" onchange="importExcel(this)"></label>
        <a class="button" href="/api/export/reads.csv">Exportar lecturas</a>
      </div>
    </div>
    <div class="card"><h2>Listas en las trampas</h2>${listStatusRows()}</div>
    <div class="card stack">
      <div class="row" style="align-items:flex-end">
        <h2 style="flex:1 1 200px;margin:0">Marcar de interés</h2>
        <label style="flex:1 1 240px">Dónde<select onchange="setScope(this.value)">${scopes.map(([value, label]) => `<option value="${value}" ${ui.scope === value ? "selected" : ""}>${escapeHtml(label)}</option>`).join("")}</select></label>
      </div>
      <div class="step">
        <label>Por biomark, código CICG o anillo: escribe o pega uno o varios, separados por espacio, coma o línea
          <textarea rows="2" oninput="ui.entries = this.value" placeholder="900_263007596629 CICG_1441 G00530">${escapeHtml(ui.entries)}</textarea></label>
        <div class="row">
          <button class="primary" onclick="markEntries('add')">Marcar en ${escapeHtml(scopeName())}</button>
          <button onclick="markEntries('remove')">Quitar de ${escapeHtml(scopeName())}</button>
        </div>
        <p class="small muted" style="margin:0">Un código CICG marca el tag que el colibrí lleva ahora. Un biomark que no está en la lista se registra al marcarlo.</p>
      </div>
      <div class="step" style="border-top:1px solid var(--soft);padding-top:12px">
        <div class="strong">Por filtros</div>
        <div class="row" style="align-items:flex-end">
          ${pick("species", "Especie", species, "Todas las especies", (v) => (v === NO_SPECIES ? "Sin especie" : v))}
          ${pick("sex", "Sexo", sexes, "Cualquiera")}
          ${pick("age", "Edad", ages, "Cualquiera")}
          <label style="flex:1 1 170px">Estado<select onchange="setFilterValue('status', this.value)">
            <option value="" ${f.status ? "" : "selected"}>Todos (tags en uso)</option>
            <option value="marked" ${f.status === "marked" ? "selected" : ""}>De interés</option>
            <option value="unmarked" ${f.status === "unmarked" ? "selected" : ""}>Sin marcar</option>
            <option value="replaced" ${f.status === "replaced" ? "selected" : ""}>Tags reemplazados (${replaced})</option></select></label>
        </div>
        <div class="row" style="align-items:flex-end">
          ${pick("project", "Proyecto", projects, "Cualquier proyecto")}
          ${pick("locality", "Localidad", localities, "Cualquier localidad")}
          ${day("from", "Capturado desde")}
          ${day("to", "Hasta")}
        </div>
        <label>Buscar biomark, código CICG, anillo o especie<input value="${escapeHtml(f.text)}" oninput="setFilterValue('text', this.value)" placeholder="CICG_1441"></label>
        <p class="small muted" style="margin:0">Proyecto, localidad y fechas son de las capturas en la base del CICG (marcaje y recapturas) y se cumplen en una misma captura. Para un solo día, pon la misma fecha en las dos.</p>
        <div id="filter-actions" class="stack" style="gap:8px"></div>
      </div>
    </div>
    <div class="card" id="subject-results"></div>
    <div class="card"><h2>Lecturas desconocidas</h2>
      <p class="small muted" style="margin:0 0 8px">Tags que leyó una trampa y que no están en la lista del CICG. Casi siempre es una lectura errónea; si es un individuo real, márcalo o regístralo aquí.</p>
      ${unknown.length ? unknown.map((s) => `<div class="row between" style="border-top:1px solid var(--soft);padding:6px 0">
        <span class="mono small" style="flex:1 1 180px">${escapeHtml(s.biomark)}</span>
        <span class="muted">${count(s.times_seen, "lectura", "lecturas")}</span>
        <div class="row"><button class="quiet" onclick="markOne('${s.tag}')">Marcar en ${escapeHtml(scopeName())}</button>
        <button class="quiet" onclick="registerUnknown('${s.tag}')">Registrar sin marcar</button></div></div>`).join("") : '<p class="muted">Ninguna.</p>'}
    </div>
    <details class="card"><summary class="strong" style="cursor:pointer;min-height:28px">Agregar un individuo que no está en la lista</summary>
      <form onsubmit="addSubject(event)" class="row" style="align-items:flex-end;margin-top:12px">
        <label style="flex:2 1 200px">Biomark (PIT)<input name="pit" required placeholder="900_263007596629"></label>
        <label style="flex:2 1 200px">Especie<input name="species" placeholder="Colibri coruscans"></label>
        <label style="flex:1 1 120px">Anillo<input name="band_number" placeholder="C00103"></label>
        <label class="row" style="flex:1 1 200px;flex-direction:row;font-size:15px;color:var(--ink)"><input type="checkbox" name="of_interest"> De interés en todas las trampas</label>
        <button class="primary">Agregar</button>
      </form></details>`;
  renderFilterResults();
}

    $("screen").innerHTML = '<div class="card muted">Ese individuo no existe.</div>';
    return;
  }
  const traps = data.overview?.traps || [];
  const field = (name, label, value) => `<label style="flex:1 1 180px">${label}<input name="${name}" value="${escapeHtml(value)}"></label>`;
  $("screen").innerHTML = `
    <div><a class="button" style="min-height:40px;border-color:#8A968F" href="#/individuos">Volver a individuos</a></div>
    <div><h1 class="${s.registered ? "italic" : "warn"}">${escapeHtml(s.registered ? (s.species || "Sin especie") : "Lectura desconocida")}</h1>
      <div class="mono muted">${s.cicg_id ? `${escapeHtml(s.cicg_id)} · ` : ""}${escapeHtml(s.biomark)}</div>
      ${s.replaced ? '<p class="warn strong" style="margin:8px 0 0">Tag reemplazado: el colibrí perdió este tag y ya lleva otro.</p>' : ""}</div>
    <div class="grid-wide">
      <div class="card"><h2>De interés en</h2>
        <button class="toggle ${s.all_traps ? "on" : ""}" onclick="toggleInterestEverywhere('${s.tag}')"><span class="strong">Todas las trampas</span><span>${s.all_traps ? "De interés" : "No"}</span></button>
        ${traps.map((t) => { const on = isOfInterest(s, t.node_id); return `<button class="toggle ${on ? "on" : ""}" onclick="toggleInterest('${s.tag}', ${t.node_id})"><span class="strong">${escapeHtml(t.name)}</span><span>${on ? "De interés" : "No"}</span></button>`; }).join("")}
        <p class="small muted" style="margin:4px 0 0">"Todas" incluye las trampas que se conecten después. La lista se envía sola.</p>
      </div>
      <div class="card"><h2>Datos del CICG</h2>
        <form onsubmit="saveSubject(event, '${s.tag}')" class="row" style="align-items:flex-end">
          ${field("species", "Especie", s.species)}
          ${field("species_code", "Código", s.species_code)}

          <button>Guardar</button>
        </form></div>
    </div>
    <div class="card"><h2>Capturas en la base del CICG</h2>
      ${s.captures.length ? s.captures.slice().reverse().map((c) => `<div class="line"><span>${escapeHtml(dayLabel(c.day))}</span><span class="muted">${escapeHtml([c.locality, c.project].filter(Boolean).join(" · ") || "—")}</span></div>`).join("") : '<p class="muted">Sin capturas en la lista importada.</p>'}
    </div>
    <div class="card scroll"><h2>Visitas</h2><div id="visit-rows"><p class="muted">Cargando…</p></div></div>`;
  loadVisits({ tag: s.tag, days: 36500 });
}

function renderVisitas() {
  const traps = data.overview?.traps || [];
  $("screen").innerHTML = `
    <div class="row between"><h1>Visitas</h1>
      <div class="row"><a class="button" href="/api/export/visits.csv">Exportar visitas</a><a class="button primary" href="/api/export/reads.csv">Exportar lecturas</a></div></div>
    <div class="row">
      <label style="flex:1 1 180px">Trampa<select onchange="setVisitTrap(this.value)"><option value="">Todas</option>${traps.map((t) => `<option value="${t.node_id}" ${String(t.node_id) === ui.visitTrap ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}</select></label>
      <label style="flex:1 1 180px">Periodo<select onchange="setPeriod(this.value)">${PERIODS.map(([v, l]) => `<option value="${v}" ${v === ui.period ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>
    <div class="card scroll" id="visit-rows"><p class="muted">Cargando…</p></div>
    <p class="small muted" style="margin:0">Una visita termina tras 3 s sin leer el tag, igual que en el análisis.</p>`;

function renderCapturas() {
  $("screen").innerHTML = '<h1>Capturas</h1><div class="card scroll" id="capture-rows"><p class="muted">Cargando…</p></div>';
  const result = { capturado: ["Capturado", "ok"], sin_colibri: ["Sin colibrí", "warn"] };
  return loadInto("capture-rows", "/api/captures", ({ captures }) => (captures.length ? `<table style="min-width:600px"><thead><tr><th>Hora</th><th>Trampa</th><th>Sujeto</th><th>Biomark</th><th>Resultado</th></tr></thead><tbody>
    ${captures.map((c) => { const [text, css] = result[c.result] || ["Por confirmar", "warn"]; return `<tr>
      <td class="mono">${escapeHtml(dateTime(c.epoch))}</td><td>${escapeHtml(trapName(c.node_id))}</td>
      <td class="${c.known ? "italic" : "warn"}">${escapeHtml(c.label)}</td><td class="mono">${escapeHtml(c.biomark)}</td>
      <td class="strong ${css}">${text}</td></tr>`; }).join("")}</tbody></table>` : '<p class="muted">Todavía no hay capturas.</p>'));
}

function renderBitacora() {
  $("screen").innerHTML = `
    <div class="row between"><h1>Bitácora</h1>
      <div class="row">${FILTERS.map(([v, l]) => `<button class="${v === ui.filter ? "selected" : ""}" onclick="setFilter('${v}')">${l}</button>`).join("")}</div></div>
    <div class="card" id="log-rows"><p class="muted">Cargando…</p></div>`;
  loadLog({ limit: 200, kind: ui.filter });
}

function isEditing() {
  const el = document.activeElement;
  if (!el) return false;
  if (el.tagName === "INPUT") return !["checkbox", "file"].includes(el.type);
  return el.tagName === "SELECT" || el.tagName === "TEXTAREA";
}

// An operator's half-typed value must survive a refresh: while a field has
// focus, new data waits. Everything else repaints, including the banners.
// A capture rings a bell at the station until someone answers it, so whoever
// is nearby hears it without watching the screen. Browsers only allow sound
// after a click on the page, so the operator turns it on once; the choice is
// remembered on this computer.
const sound = { on: false, ctx: null, lastRing: 0, notified: new Set() };
try { sound.on = localStorage.getItem("captureSound") === "on"; } catch (_) { /* private window: off */ }
const RING_EVERY_MS = 6000;

function audioReady() {
  if (!sound.ctx) {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return false;
    sound.ctx = new Context();
  }
  if (sound.ctx.state === "suspended") sound.ctx.resume();
  return sound.ctx.state === "running";
}

// Two strikes, ding-dong, each a few inharmonic partials fading out like a bell.
function bell() {
  if (!audioReady()) return;
  const ctx = sound.ctx;
  const strike = (at, base) => {
    for (const [ratio, level] of [[1, 0.35], [2.76, 0.12], [5.4, 0.05]]) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = base * ratio;
      gain.gain.setValueAtTime(level, at);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 1.6);
      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + 1.7);
    }
  };
  strike(ctx.currentTime, 880);
  strike(ctx.currentTime + 0.45, 660);
}

function toggleCaptureSound() {
  sound.on = !sound.on;
  try { localStorage.setItem("captureSound", sound.on ? "on" : "off"); } catch (_) { /* not remembered */ }
  if (sound.on) {
    bell();
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  }
  render(true);
}

// The first click anywhere also unlocks the sound when it was left on.
document.addEventListener("pointerdown", () => { if (sound.on) audioReady(); }, { once: true });

function announceCaptures() {
  const pending = (data.overview?.traps || []).filter((t) => t.capture);
  document.title = pending.length ? `¡Captura! · Estación CICG` : "Estación CICG";
  if (!pending.length || !sound.on) return;
  if (Date.now() - sound.lastRing >= RING_EVERY_MS) {
    sound.lastRing = Date.now();
    bell();
  }
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  for (const t of pending) {
    const key = `${t.node_id}:${t.capture.at}`;
    if (sound.notified.has(key)) continue;
    sound.notified.add(key);
    const subject = subjectByTag(t.capture.tag);
    new Notification(`Captura en ${t.name}`, {
      body: subject?.registered ? `${subject.species || "Sin especie"} · ${subject.biomark}` : "Lectura desconocida",
      requireInteraction: true,
    });
  }
}

function render(force) {
  renderBanners();
  announceCaptures();
  const r = route();
  document.querySelectorAll("nav a").forEach((a) => {
    const name = a.dataset.nav;
    const on = name === r.screen || (r.screen === "trampa" && name === "inicio")
      || (r.screen === "individuo" && name === "individuos");
    a.classList.toggle("on", on);
  });
  const online = (data.overview?.traps || []).filter((t) => t.reachable).length;
  const link = data.health?.link;
  const soundNote = !sound.on ? "Sonido de captura: apagado"
    : sound.ctx?.state === "running" ? "Sonido de captura: encendido" : "Sonido: haz clic en la página";
  $("nav-status").innerHTML = `<div><a href="#/gateway">${link && link.connected === false ? "Gateway desconectada" : "Gateway conectada"}</a></div><div>${count(online, "trampa en línea", "trampas en línea")}</div>
    <div style="margin-top:10px"><a href="#" onclick="toggleCaptureSound(); return false">${soundNote}</a></div>
    <div style="margin-top:10px">${data.overview?.paused
      ? '<a href="#" onclick="resumeTraps(); return false">Trampas desactivadas: activar todas</a>'
      : '<a href="#" onclick="pauseTraps(); return false">Desactivar todas las trampas</a>'}</div>`;
  if (!force && isEditing()) return;
  if (r.screen === "trampa") renderTrampa(r.id, r.tab);
  else if (r.screen === "individuos") renderIndividuos();
  else if (r.screen === "individuo") renderIndividuo(r.id);
  else if (r.screen === "visitas") renderVisitas();
  else if (r.screen === "capturas") renderCapturas();
  else if (r.screen === "bitacora") renderBitacora();
  else if (r.screen === "gateway") renderGateway();
  else renderInicio();
}

async function refresh(force) {
  const onGateway = route().screen === "gateway";
  const [overview, health, specimens, gateway, update] = await Promise.all([
    fetch("/api/overview").then((r) => r.json()).catch(() => data.overview),
    fetch("/health").then((r) => r.json()).catch(() => data.health),
    fetch("/api/specimens").then((r) => r.json()).catch(() => data.specimens),
    onGateway ? fetch("/api/gateway").then((r) => r.json()).catch(() => data.gateway) : data.gateway,
    fetch("/api/update").then((r) => r.json()).catch(() => data.update),
  ]);
  Object.assign(data, { overview, health, specimens, gateway, update });
  render(force === true);
}

// The port the gateway is on: chosen here, tried at once, remembered for the
// next start. "Automático" is right whenever only the gateway is plugged in.
function renderGateway() {
  const g = data.gateway;
  if (!g) {
    $("screen").innerHTML = '<h1>Gateway</h1><div class="card muted">Cargando…</div>';
    return;
  }
  if (!g.enabled) {
    $("screen").innerHTML = '<h1>Gateway</h1><div class="card">La estación arrancó sin gateway (--no-gateway).</div>';
    return;
  }
  const state = g.connected
    ? `<span class="ok strong">Conectada</span> en <span class="mono">${escapeHtml(g.device)}</span>`
    : `<span class="warn strong">Sin conexión</span>${g.last_error ? `: ${escapeHtml(g.last_error)}` : ""}`;
  const listed = g.ports.some((p) => p.device === g.configured);
  const option = (value, label) => `<option value="${escapeHtml(value)}" ${g.configured === value ? "selected" : ""}>${escapeHtml(label)}</option>`;
  const options = [option("auto", "Automático (el único puerto USB)")]
    .concat(g.ports.map((p) => option(p.device, `${p.device}${p.description ? ` · ${p.description}` : ""}${p.usb ? "" : " (no es USB)"}`)))
    .concat(g.configured && g.configured !== "auto" && !listed ? [option(g.configured, `${g.configured} (no está conectado)`)] : []);
  $("screen").innerHTML = `
    <h1>Gateway</h1>
    <div class="card stack narrow">
      <div>${state}</div>
      <label>Puerto de la gateway<select id="gateway-port">${options.join("")}</select></label>
      <div class="row"><button class="primary" onclick="chooseGatewayPort()">Usar este puerto</button></div>
      <p class="small muted" style="margin:0">Se prueba de inmediato y la estación lo recuerda la próxima vez que la abras. "Automático" sirve cuando la gateway es lo único conectado por USB; con varias placas conectadas, elige el puerto.</p>
    </div>`;
}

async function chooseGatewayPort() {
  const device = $("gateway-port").value;
  document.activeElement?.blur();
  const result = await act("/api/gateway", jsonBody("PUT", { device }));
  if (result) {
    ui.message = device === "auto" ? "Gateway en automático." : `Gateway en ${device}.`;
    render(true);
  }
}

window.addEventListener("hashchange", () => {
  ui.message = "";
  if (route().screen === "gateway") refresh(true); else render(true);
});
new EventSource("/api/events").onmessage = () => refresh();
refresh(true);
setInterval(refresh, 5000);
</script>
