<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación CICG</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; margin: 0; padding: 0 .75rem 2rem;
    background: #111; color: #eee; font-size: 16px; max-width: 100vw; overflow-x: hidden;
  }
  header { position: sticky; top: 0; z-index: 10; background: #111; padding-top: .5rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: .5rem 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .5rem; }

  .banner { border-radius: 8px; padding: .75rem; margin: .5rem 0; font-size: .95rem; }
  .banner-clock { background: #402a00; border: 1px solid #a86a00; color: #ffcf7a; }
  .banner-capture { background: #3a0d0d; border: 2px solid #c93a3a; padding: 1rem; }
  .banner-capture strong { font-size: 1.05rem; }
  .banner-capture button {
    font: inherit; min-height: 44px; min-width: 44px; padding: .6rem 1.1rem; border-radius: 6px;
    border: 1px solid #c93a3a; background: #c93a3a; color: #fff; font-weight: 600; margin-top: .5rem;
  }

  .trap { border: 1px solid #333; border-radius: 8px; padding: .75rem; margin: .5rem 0; }
  .trap.no-contact { border-color: #a86a00; }
  .state { font-weight: 700; text-transform: uppercase; font-size: .8rem; letter-spacing: .05em; }
  .no-contact-badge { color: #ffb648; font-weight: 700; margin: .3rem 0; }
  /* WARNING 2 (verify-report-batch2c.md): bold, same weight as
     .no-contact-badge, not the previous small italic -- doubt about a
     trap's own state must read at a glance next to "SIN CONTACTO", not
     as a footnote nobody notices. */
  .stale-badge { color: #ffcf7a; font-weight: 700; margin: .3rem 0; }
  .pending { color: #7ec8ff; font-size: .85rem; }
  .muted { color: #999; font-size: .85rem; }
  .empty { color: #999; }

  .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
  button {
    font: inherit; min-height: 44px; padding: .6rem 1rem; border-radius: 6px;
    border: 1px solid #555; background: #222; color: #eee;
  }

  .threshold-control { margin: .4rem 0; font-size: .85rem; }
  .threshold-control input[type=range] { width: 100%; height: 2rem; margin-top: .3rem; }

  .reads { margin-top: .5rem; }
  .read-group {
    padding: .3rem .5rem; margin: .25rem 0; border-radius: 6px; background: #1a1a1a;
    font-size: .85rem; border-left: 3px solid transparent;
  }
  .read-group-live { border-left-color: #7ee787; }
  .read-tag { font-family: monospace; }

  details { margin-top: .6rem; }
  summary { cursor: pointer; padding: .5rem 0; min-height: 44px; display: flex; align-items: center; }
  textarea {
    width: 100%; min-height: 6rem; font: inherit; font-size: 16px; background: #1a1a1a;
    color: #eee; border: 1px solid #444; border-radius: 6px; padding: .5rem; margin-top: .4rem;
  }
  .field-error { color: #ff8a8a; font-size: .85rem; margin-top: .3rem; }
  .field-ok { color: #7ee787; font-size: .85rem; margin-top: .3rem; }

  /* station/specimen-roster: an operator manages the roster and marks who
     is wanted, instead of typing hex strings into each trap
     (docs/pending.md). */
  .specimen { border: 1px solid #333; border-radius: 8px; padding: .75rem; margin: .5rem 0; }
  .specimen input[type=text] {
    width: 100%; font: inherit; font-size: 16px; background: #1a1a1a; color: #eee;
    border: 1px solid #444; border-radius: 6px; padding: .5rem; margin: .3rem 0;
  }
  /* The label, not the bare checkbox, is the 44px touch target -- a
     platform checkbox alone renders far smaller than that on most phones. */
  .of-interest-toggle {
    display: flex; align-items: center; gap: .5rem; min-height: 44px; cursor: pointer;
  }
  .of-interest-toggle input[type=checkbox] { width: 1.5rem; height: 1.5rem; }
  .roster-counter { margin: .3rem 0 .6rem; }
</style>
<header>
  <h1>Estación CICG</h1>
  <div id="clock-banner"></div>
  <div id="link-banner"></div>
  <div id="capture-banner"></div>
  <div id="threshold-control" class="threshold-control">
    <label for="threshold-input">
      Umbral "todavía aquí": <span id="threshold-value">60</span> s
    </label>
    <input type="range" id="threshold-input" min="10" max="600" step="10" value="60"
      oninput="onThresholdChange(this.value)">
  </div>
</header>
<div id="traps">Cargando…</div>
<!-- Not a <details>: marking an animal is how an operator decides what every
     trap hunts, so it cannot sit collapsed behind a disclosure triangle where
     nobody finds it. Reported on the bench 2026-09-26: "no veo en la interfaz
     como setear el target" -- the feature was built and invisible. -->
<h2>Especímenes registrados</h2>
<div id="specimens">Cargando…</div>
<script>
const $ = (id) => document.getElementById(id);

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// docs/pending.md, "Operator-facing gaps": "armed/fired/idle in English on
// a Spanish page" -- every wire-vocabulary word the operator reads must be
// Spanish, like every other label. Falls back to the raw value for a state
// this page does not know yet, rather than crashing on one docs/design.md
// may add later.
const STATE_ES = { idle: "en reposo", armed: "armada", fired: "disparada", fault: "en falla" };
function translateState(state) { return STATE_ES[state] || state; }

// docs/pending.md, "Operator-facing gaps": an ISO timestamp answers nothing
// a live view's whole job ("is this happening now") needs -- "hace 3
// minutos" does. `nowEpoch` is always a caller-supplied parameter, never
// Date.now() read from inside here, so this stays a pure function whose
// caller controls what "now" means (see groupReadsByTag's own docstring
// for why that matters).
function formatRelative(epochSeconds, nowEpoch) {
  const diff = Math.max(0, Math.round(nowEpoch - epochSeconds));
  if (diff < 10) return "hace instantes";
  if (diff < 60) return `hace ${diff} segundos`;
  const minutes = Math.round(diff / 60);
  if (minutes < 60) return `hace ${minutes} ${minutes === 1 ? "minuto" : "minutos"}`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `hace ${hours} ${hours === 1 ? "hora" : "horas"}`;
  const days = Math.round(hours / 24);
  return `hace ${days} ${days === 1 ? "día" : "días"}`;
}

function epochOf(isoString) {
  return Date.parse(isoString) / 1000;
}

// station/live-reads-view: groups one feeder's own reads by tag under a
// "still here" gap -- a viewer control the operator adjusts with the
// slider above, applied here, at render time, and nowhere else (design.md
// 3.2's amendment: the gap that ends a visit is a biological parameter,
// never something this station computes or caches; docs/pending.md: a
// `visits` view "cannot disagree with its source, because there is no
// second copy"). `reads` must already be scoped to one node_id before
// this is ever called -- see renderTrap below -- a tag seen at two
// feeders must never share a group, and this function has no node_id of
// its own to enforce that with, only what its caller already filtered.
function groupReadsByTag(reads, thresholdSeconds, nowEpoch) {
  const byTag = new Map();
  for (const r of reads) {
    // A masked node_epoch (untrusted clock, phase 2) is never fabricated
    // into a confident time -- received_epoch (the station's own clock,
    // always present) is the honest fallback, flagged as estimated so the
    // render can say so rather than imply certainty it does not have.
    const estimated = r.node_epoch == null;
    const epoch = estimated ? r.received_epoch : r.node_epoch;
    const list = byTag.get(r.tag) || [];
    list.push({ epoch, estimated });
    byTag.set(r.tag, list);
  }
  const groups = [];
  for (const [tag, entries] of byTag) {
    entries.sort((a, b) => a.epoch - b.epoch);
    let current = null;
    for (const entry of entries) {
      if (current && entry.epoch - current.lastEpoch <= thresholdSeconds) {
        current.count += 1;
        current.lastEpoch = entry.epoch;
        current.lastEpochEstimated = entry.estimated;
      } else {
        current = {
          tag, count: 1, firstEpoch: entry.epoch,
          lastEpoch: entry.epoch, lastEpochEstimated: entry.estimated,
        };
        groups.push(current);
      }
    }
  }
  // Recomputed from nowEpoch on every call -- never cached -- so a group
  // that stops updating stops reading "sigue aquí" the moment enough real
  // time passes, even with no new data arriving (docs/pending.md's own
  // characteristic defect: "state that was true once, presented as true
  // now"). The periodic tick below (`rerender`) is what keeps calling this
  // with a fresh nowEpoch between fetches.
  for (const g of groups) {
    g.stillGrowing = nowEpoch - g.lastEpoch <= thresholdSeconds;
  }
  groups.sort((a, b) => b.lastEpoch - a.lastEpoch);
  return groups;
}

function renderReadGroup(g, nowEpoch) {
  const count = g.count === 1 ? "1 lectura" : `${g.count} lecturas`;
  const since = g.count > 1 ? ` · desde ${formatRelative(g.firstEpoch, nowEpoch)}` : "";
  const status = g.stillGrowing
    ? "sigue aquí"
    : `última lectura ${formatRelative(g.lastEpoch, nowEpoch)}`;
  const clockNote = g.lastEpochEstimated
    ? ' <span class="muted">(reloj del nodo sin confirmar)</span>' : "";
  return `<div class="read-group ${g.stillGrowing ? "read-group-live" : ""}">` +
    `<span class="read-tag">${escapeHtml(g.tag)}</span> · ${count}${since} · ${status}${clockNote}` +
    `</div>`;
}

function renderReadsSection(reads, nowEpoch) {
  const groups = groupReadsByTag(reads, thresholdSeconds, nowEpoch);
  return groups.length
    ? groups.map((g) => renderReadGroup(g, nowEpoch)).join("")
    : '<p class="muted">Sin lecturas recientes.</p>';
}

// The operator's own "still here" slider -- never sent to the station, never
// stored (design.md 3.2's amendment). Kept as an in-memory variable, not
// localStorage: it is a per-session viewing choice, not a station setting.
let thresholdSeconds = 60;

function onThresholdChange(value) {
  thresholdSeconds = Number(value);
  $("threshold-value").textContent = String(thresholdSeconds);
  rerender();
}

// The last data `refresh()` actually fetched -- `rerender()` reuses it so
// the reads view (and Últ. contacto) can be recomputed against a fresh
// `Date.now()` between fetches, without a new network round trip.
let latestTraps = [];
let latestReadsByNode = {};

function rerender() {
  renderTraps(latestTraps, latestReadsByNode, Date.now() / 1000);
}

const EMPTY_ROSTER = { specimens: [], of_interest_count: 0, of_interest_limit: 0 };

async function refresh() {
  const [traps, health, reads, roster] = await Promise.all([
    fetch("/api/traps").then((r) => r.json()),
    fetch("/health").then((r) => r.json()).catch(() => null),
    fetch("/api/reads").then((r) => r.json()).catch(() => ({})),
    fetch("/api/specimens").then((r) => r.json()).catch(() => EMPTY_ROSTER),
  ]);
  latestTraps = traps;
  latestReadsByNode = reads;
  renderClockBanner(health);
  renderLinkBanner(health);
  renderCaptureBanner(traps);
  renderTraps(traps, reads, Date.now() / 1000);
  renderRoster(roster);
}

// S12: an unset clock is a banner, not a footnote -- every timestamp on this
// page is suspect until this clears, so it renders above everything else,
// pinned, for as long as /health says `unset`.
function renderClockBanner(health) {
  $("clock-banner").innerHTML = (health && health.clock_trust === "unset")
    ? '<div class="banner banner-clock">⚠ Reloj de la estación sin confirmar. ' +
      "Las horas en esta pantalla pueden ser incorrectas.</div>"
    : "";
}

// CRITICAL 5 (sdd-verify, field-station-p4): the station's own radio link
// going down must be visible here, not inferred from every trap quietly
// turning unreachable one by one -- design.md section 4, "the gateway
// never pretends the link is up." `null` when no gateway is configured at
// all, which is not a fault.
function renderLinkBanner(health) {
  const link = health && health.link;
  $("link-banner").innerHTML = (link && link.connected === false)
    ? '<div class="banner banner-clock">⚠ Enlace de radio de la estación caído.' +
      (link.last_error ? ` (${escapeHtml(link.last_error)})` : "") +
      "</div>"
    : "";
}

// S3: an unacknowledged capture is the loudest thing on the page, pinned in
// the header so it stays visible while scrolling the trap list below, and
// offering exactly one action.
function renderCaptureBanner(traps) {
  const captured = traps.filter((t) => t.capture);
  $("capture-banner").innerHTML = captured.map((t) => `
    <div class="banner banner-capture">
      <strong>Trampa ${t.node_id} capturó una marca</strong><br>
      Marca ${escapeHtml(t.capture.tag)}<br>
      <small>${escapeHtml(t.capture.at)}</small><br>
      <button onclick="ack(${t.node_id})">Atendida</button>
    </div>`).join("");
}

function renderTraps(traps, readsByNode, nowEpoch) {
  $("traps").innerHTML = traps.length
    ? traps.map((t) => renderTrap(t, readsByNode, nowEpoch)).join("")
    : '<p class="empty">Ninguna trampa se ha reportado todavía.</p>';
}

// S4/S11: `reachable` is a fact separate from `state` -- a trap we cannot
// reach is never shown as simply "armed"; the two facts stay visually
// distinct here rather than merged into one reassuring line.
function renderTrap(t, readsByNode, nowEpoch) {
  const noContact = !t.reachable;
  const battery = t.battery_mv != null ? `${t.battery_mv} mV` : "sin dato";
  const version = t.targets_version != null ? t.targets_version : "—";
  // docs/pending.md, "Operator-facing gaps": an ISO timestamp answers
  // nothing a live view needs -- "hace 3 minutos" does.
  const lastSeen = t.last_seen ? formatRelative(epochOf(t.last_seen), nowEpoch) : "nunca";
  // WARNING J (sdd-verify field-station-p4): `state` is `null` exactly
  // when this station has no readable report to show -- never render
  // that as the English enum values around it would suggest by omission;
  // say so, in Spanish, same as every other "no data" label on this page.
  // docs/pending.md, "Operator-facing gaps": the reported value itself
  // must also be Spanish, not the raw English wire word.
  const state = t.state != null ? translateState(t.state) : "desconocido";
  // WARNING 2 (sdd-verify field-station-p4 batch 2 close-out): a stale-
  // flagged trap must not render byte-identical to a confident one --
  // independent of `reachable` (`no-contact-badge` above), which after a
  // restart comes from whichever row won the state race and can stay
  // `true` even while that row's own freshness is in doubt.
  // Record correction (Batch 2e, verify-report-batch2d.md Q7): this
  // comment used to say "rendered as doubt (italic)", but `.stale-badge`
  // has been `font-weight: 700` -- the same bold weight as
  // `.no-contact-badge`, no italic -- since the very commit that added
  // this comment. The CSS is what an operator needs: doubt about a
  // trap's own state must read at a glance next to "SIN CONTACTO", not as
  // a footnote nobody notices at a smaller, lighter weight. The comment
  // was wrong, not the rule; this trap is still not silent, its
  // last-known word just might not be its newest one.
  // 13.11/13.12: what the trap is actually hunting -- the station's own
  // desired list, not only its version number.
  const targets = (t.targets && t.targets.length)
    ? t.targets.map(escapeHtml).join(", ")
    : "ninguno";
  // station/live-reads-view: this feeder's own slice of the reads window,
  // scoped by node_id *before* any grouping by tag happens -- a tag seen
  // at two feeders must never be merged into one feeder's section.
  const reads = readsByNode[t.node_id] || [];
  return `
    <div class="trap ${noContact ? "no-contact" : ""}">
      <div class="state">Trampa ${t.node_id} · ${state}</div>
      ${noContact ? '<p class="no-contact-badge">⚠ SIN CONTACTO — este estado puede estar desactualizado</p>' : ""}
      ${t.state_may_be_stale ? '<p class="stale-badge">⚠ puede no ser el último reporte de esta trampa</p>' : ""}
      <p class="muted">Batería: ${battery} · Lista de objetivos: v${version} · Últ. contacto: ${lastSeen}</p>
      <p class="muted">Objetivos actuales: ${targets}</p>
      <div class="reads">
        <p class="muted">Lecturas recientes:</p>
        ${renderReadsSection(reads, nowEpoch)}
      </div>
      ${t.pending_command ? `<p class="pending">${describePending(t)}</p>` : ""}
      <div class="actions">
        <button onclick="disarm(${t.node_id})">Desarmar</button>
        ${t.pending_command ? `<button onclick="cancelCommand(${t.node_id})">Cancelar comando pendiente</button>` : ""}
      </div>
    </div>`;
}

// docs/pending.md, "Remove the remote arm affordance": there is no
// "Armar" button any more (arming needs a person at the trap, not a
// downlink), but `pending_command === "arm"` is still a real state this
// page can be handed -- a station that boots against a database from
// before this change rehydrates a pre-existing ARM command
// (`adapters/store.py`'s own rehydration, kept for exactly that reason).
// Rendering it correctly here, rather than deleting the branch, is what
// "leave nothing that renders a state the operator can no longer reach"
// means in practice: the operator cannot have *caused* this pending
// "arm", but they can still read it, and cancel it below.
function describePending(t) {
  if (t.pending_command === "set_targets") {
    return `Lista de objetivos v${t.desired_targets_version} pendiente de confirmar`;
  }
  const verb = t.pending_command === "arm" ? "Armado" : "Desarmado";
  return `${verb} pendiente de confirmar`;
}

async function disarm(id) { await fetch(`/api/traps/${id}/disarm`, { method: "POST" }); refresh(); }
async function ack(id) { await fetch(`/api/traps/${id}/acknowledge`, { method: "POST" }); refresh(); }
async function cancelCommand(id) { await fetch(`/api/traps/${id}/cancel`, { method: "POST" }); refresh(); }

// station/specimen-roster: the study decides which animals are of interest,
// not the feeder (messages.md's open question 2, answered 2026-09-26) -- an
// operator manages this one roster and marks who is wanted; marking one
// pushes the whole shared list to every trap the station knows about
// (app.py::_push_targets_to_every_known_trap), never a list typed per trap.
function renderRoster(roster) {
  const rows = roster.specimens || [];
  const counter = `<p class="muted roster-counter">` +
    `${roster.of_interest_count} / ${roster.of_interest_limit} marcadas de interés</p>`;
  const body = rows.length
    ? rows.map(renderSpecimen).join("")
    : '<p class="empty">Ningún espécimen conocido todavía.</p>';
  $("specimens").innerHTML = counter + body;
}

// The `of_interest` this specimen last reported from the server, keyed by
// tag -- `saveSpecimen` compares the checkbox against this before deciding
// whether `of_interest` belongs in the PATCH body at all. Without this, a
// species/band-only save would resend the checkbox's current value every
// time regardless of whether it actually changed, and the route treats any
// *presence* of the key as "recompute and broadcast" (app.py:
// `if "of_interest" in updates`) -- so an untouched checkbox would still
// re-push SET_TARGETS to every trap for an edit that was never about
// targets at all.
const originalOfInterest = {};

function renderSpecimen(s) {
  originalOfInterest[s.tag] = s.of_interest;
  const lastSeen = s.last_seen
    ? formatRelative(epochOf(s.last_seen), Date.now() / 1000)
    : "nunca";
  const timesSeen = s.times_seen === 1 ? "1 lectura" : `${s.times_seen} lecturas`;
  return `
    <div class="specimen">
      <div class="state">Marca ${escapeHtml(s.tag)}</div>
      <p class="muted">${timesSeen} · últ. vez: ${lastSeen}</p>
      <input type="text" id="species-${s.tag}" placeholder="Especie"
        value="${escapeHtml(s.species || "")}">
      <input type="text" id="band-${s.tag}" placeholder="Número de anillo"
        value="${escapeHtml(s.band_number || "")}">
      <label class="of-interest-toggle" for="interest-${s.tag}">
        <input type="checkbox" id="interest-${s.tag}" ${s.of_interest ? "checked" : ""}>
        De interés — las trampas lo capturan
      </label>
      <div class="actions">
        <button onclick="saveSpecimen('${s.tag}')">Guardar</button>
      </div>
      <div id="specimen-msg-${s.tag}"></div>
    </div>`;
}

async function saveSpecimen(tagHex) {
  const msg = $(`specimen-msg-${tagHex}`);
  const species = $(`species-${tagHex}`).value.trim();
  const bandNumber = $(`band-${tagHex}`).value.trim();
  const ofInterest = $(`interest-${tagHex}`).checked;
  const body = { species: species || null, band_number: bandNumber || null };
  // Only a checkbox the operator actually touched belongs in this request --
  // see `originalOfInterest`'s own comment for why including it unconditionally
  // would re-broadcast SET_TARGETS on every species/band-only save.
  if (ofInterest !== originalOfInterest[tagHex]) {
    body.of_interest = ofInterest;
  }
  const response = await fetch(`/api/specimens/${tagHex}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (response.ok) {
    msg.innerHTML = '<p class="field-ok">Guardado. Esperando confirmación de las trampas.</p>';
    refresh();
  } else {
    msg.innerHTML = '<p class="field-error">No se pudo guardar: puede que ya haya demasiadas ' +
      "marcas de interés a la vez.</p>";
  }
}

new EventSource("/api/events").onmessage = refresh;
refresh();
setInterval(refresh, 30000);
// station/live-reads-view: no new fetch -- recomputes Últ. contacto and
// every read group's relative time and "sigue aquí"/stale distinction
// against a fresh Date.now(), so both keep advancing between the 30s
// fetches and the operator's own SSE-triggered refreshes.
setInterval(rerender, 5000);
</script>
</html>
